<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Quantum">
  <title>Quantum</title>
  <desc>Tres niveles de energía cuantizados y el cuanto (punto de señal) en el nivel inferior. Variante para tema oscuro.</desc>
  <!-- eje de transición (tenue) -->
  <line x1="60" y1="28" x2="60" y2="92" stroke="#6B7488" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <!-- tres niveles cuantizados; longitudes distintas = la asimetría real de la suite -->
  <line x1="22" y1="86" x2="98" y2="86" stroke="#A4AEC2" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="60" x2="90" y2="60" stroke="#A4AEC2" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="82" y2="34" stroke="#A4AEC2" stroke-width="3" stroke-linecap="round"/>
  <!-- ticks de cuantización en el eje -->
  <g stroke="#6B7488" stroke-width="1" opacity="0.6">
    <line x1="55" y1="34" x2="65" y2="34"/>
    <line x1="55" y1="60" x2="65" y2="60"/>
    <line x1="55" y1="86" x2="65" y2="86"/>
  </g>
  <!-- el cuanto: punto de señal (verde fósforo, variante oscura) en el nivel inferior -->
  <circle cx="60" cy="86" r="9" fill="none" stroke="#2BE49B" stroke-width="1.2" opacity="0.4"/>
  <circle cx="60" cy="86" r="5.6" fill="#2BE49B"/>
</svg>
