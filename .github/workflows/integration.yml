name: CI de integración (trío Quantum)

# Plano de CI "de integración" del paraguas (ver docs/ROADMAP.md §6): verifica que
# el TRÍO fijado por los submódulos + go.work —el conjunto que versions.yaml
# certifica— COMPILA y pasa `go vet` junto. No re-ejecuta la suite completa de cada
# producto (eso vive en el CI por-repo de cada uno, p.ej. la matriz de 6 motores de
# Quark), con UNA excepción deliberada: el job `orbit-lockstep` SÍ corre los tests
# de orbit contra el nucleus fijado por el workspace — es el arnés de lockstep de
# QADR-0005 (gate v1.0 de nucleus, ítem A-7): para validar un release candidate de
# nucleus antes de taggear, se abre un PR que bumpee el submódulo nucleus al RC y
# este lane ejecuta los tests de orbit contra él. El root del workspace NO es un
# módulo, por eso se usan patrones explícitos por producto.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # QM8-1: entre rondas nada re-compilaba el set ni re-ejecutaba `go install
    # @tag` — la deriva externa (proxy/sumdb, tags movidos o borrados, deps que
    # dejan de resolver) solo afloraba al abrir un PR. Lunes 06:30 UTC,
    # ESCALONADO 30 min tras la corrida de suite-integral (06:00): schedule
    # propio en vez de workflow_call porque no acopla los dos workflows (cada
    # lane conserva su veredicto y su issue de fallo atribuible) y es lo más
    # simple de mantener; el escalón evita competir por runners y ordena los
    # avisos de una misma mañana roja.
    - cron: '30 6 * * 1'

permissions:
  contents: read

# Una corrida por rama; un push nuevo cancela la anterior en curso.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Los DIEZ módulos del go.work (el root no es módulo → patrones explícitos;
  # RT-7: la lista iba una atrás — prometía «nueve» y omitía providers/ldap —
  # y `go build` con módulos de menos sale igualmente con EXIT=0; al tocar el
  # go.work, tocar esta lista y el comando del README).
  # quarkbridge (QADR-0006 Caso 1) y quarkdatasource (Caso 2) son los módulos
  # opt-in que cruzan productos — dependen de Quark Y de Nucleus/Orbit — así que
  # son los patrones que más valor sacan de este plano; showcase_demo (Fase 4)
  # es la app que ejerce los TRES productos juntos con ambos puentes cableados.
  MODULES: ./quark/... ./nucleus/... ./nucleus/examples/showcase_demo/... ./nucleus/providers/ldap/... ./orbit/... ./orbit/agent/... ./orbit/proto/... ./orbit/quarkbridge/... ./orbit/quarkdatasource/... ./orbit/server/...

jobs:
  manifest-guard:
    name: manifest-guard (pin ↔ tag ↔ gitlink)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (con submódulos — son el trío fijado)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags de los submódulos: el guard compara cada pin con el commit del
          # tag publicado, así que necesita los tags de quark/nucleus/orbit.
          fetch-depth: 0

      - name: El manifiesto no puede afirmar lo que git no respalda
        # QM-P0-1: versions.yaml solo certifica un set que git realmente
        # respalda — cada pin debe ser a la vez el gitlink del submódulo y el
        # commit al que apunta el tag de la versión que declara `modules`.
        run: bash scripts/manifest-guard.sh

  # El manifiesto afirma que los binarios se instalan por tag; hasta la 5ª
  # ronda ningún job lo ejecutaba, y el comando literal de versions.yaml llevaba
  # semanas siendo inválido (QM5-5). Este job hace lo que un usuario haría:
  # `go install …@<versión>` con caché de módulos virgen y GOWORK=off, con la
  # versión derivada del último tag de server del submódulo pinado (la misma
  # fuente que verifica manifest-guard §3).
  go-install-tag:
    name: go install admin-server@tag (caché virgen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (con submódulos — el tag sale del submódulo pinado)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go (versión declarada en go.work)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false # caché de módulos deliberadamente virgen

      - name: Instala el admin-server del último tag publicado
        run: |
          git -C orbit fetch --tags --quiet origin
          tag=$(git -C orbit tag -l 'server/v*' | grep -E '^server/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          version="${tag#server/}"
          echo "instalando github.com/jcsvwinston/orbit/server/cmd/admin-server@${version}"
          export GOMODCACHE="$(mktemp -d)" GOWORK=off GOBIN="$(mktemp -d)"
          go install "github.com/jcsvwinston/orbit/server/cmd/admin-server@${version}"
          "$GOBIN/admin-server" --version

  build:
    name: build + vet del set fijado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (con submódulos — son el trío fijado)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go (versión declarada en go.work)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Trío fijado (traza de los pins frente a versions.yaml)
        run: git submodule status

      - name: Build del trío junto
        run: go build $MODULES

      - name: Vet del trío junto
        run: go vet $MODULES

  # DX-27: hasta esta lane, showcase_demo solo se COMPILABA. Este job ejecuta
  # lo que el ejemplo promete (QADR-0006): arranca la app, crea un artículo por
  # la API pública y exige que el feed SQL en vivo de Orbit haya visto el
  # INSERT de Quark (Caso 1, quarkbridge) y que Data Studio liste los modelos
  # (Caso 2, quarkdatasource). El CI falla si el feed en vivo deja de ver SQL
  # de Quark.
  showcase-smoke:
    name: smoke funcional del showcase (los tres juntos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (con submódulos — son el trío fijado)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go (versión declarada en go.work)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Arranca, crea, y verifica feed en vivo + Data Studio
        run: bash scripts/ci/showcase_smoke.sh

  orbit-lockstep:
    name: tests de orbit contra el nucleus fijado (lockstep, A-7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Los seis módulos de orbit (core, agente, proto, server y los dos puentes):
      # todos resuelven nucleus/quark por el go.work, así que este job ejercita la
      # superficie Tier-1 que orbit consume contra el pin actual del workspace.
      ORBIT_MODULES: ./orbit/... ./orbit/agent/... ./orbit/proto/... ./orbit/quarkbridge/... ./orbit/quarkdatasource/... ./orbit/server/...
    steps:
      - name: Checkout (con submódulos — son el trío fijado)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go (versión declarada en go.work)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Nucleus bajo prueba (traza del pin)
        run: git -C nucleus log -1 --format='%H %s'

      - name: Tests de orbit en el workspace
        run: go test $ORBIT_MODULES

  # QM8-1: el schedule rojo no puede morir en el email default de Actions.
  # Solo en corridas programadas (los PRs ya tienen su rojo a la vista): abre
  # o actualiza (dedupe server-side por etiqueta+título) el issue "[lane] fallo
  # del schedule integration.yml <fecha>" con el enlace al run, vía GITHUB_TOKEN.
  # MAQ-4/(c): además de failure(), cubre cancelled() — un schedule cancelado
  # por `concurrency` perdía el aviso.
  # RT-8: `needs` debe listar TODOS los jobs del workflow — failure() solo mira
  # la cadena de dependencias, así que un job fuera de la lista (le pasó a
  # showcase-smoke) enrojecía el lunes sin abrir issue. Al añadir un job aquí,
  # añadirlo también a esta lista.
  notify-schedule-failure:
    name: aviso activo del schedule rojo/cancelado (issue)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [manifest-guard, go-install-tag, build, showcase-smoke, orbit-lockstep]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (solo el script de aviso, sin submódulos)
        uses: actions/checkout@v4

      - name: Abre o actualiza el issue del fallo
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/notify_schedule_failure.sh "integration.yml" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # MAQ-4/(a): si el PROPIO aviso falló, el rojo no puede degradar al email
      # default (QM8-1, insuficiente). Canal fijo de último recurso, siempre
      # visible: anotación ::error::, resumen del job, y un issue de título FIJO
      # (dedup bracket-free, independiente del canal principal que falló).
      - name: Canal de último recurso si el aviso falló
        if: always() && steps.notify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error title=Notificador del schedule caído::El aviso del schedule rojo/cancelado de integration.yml FALLÓ (run: $run_url). Revisar permisos issues:write / la API de gh."
          {
            echo "## Notificador del schedule CAÍDO — integration.yml"
            echo "El job de aviso no pudo abrir/actualizar su issue. Run: $run_url"
            echo "El email default de Actions no basta (QM8-1); revisa el notificador."
          } >> "$GITHUB_STEP_SUMMARY"
          # Último recurso best-effort: issue de título FIJO, dedup bracket-free.
          fixed_prefix="NOTIFICADOR CAÍDO integration.yml"
          if gh issue list --state open --search "$fixed_prefix in:title" --limit 20 --json title --jq '.[].title' 2>/dev/null | grep -Fq "$fixed_prefix"; then
            echo "issue de último recurso ya abierto — no se duplica"
          else
            gh issue create --title "[lane] $fixed_prefix" \
              --body "El aviso automático del schedule de integration.yml falló ANTES de registrar el rojo. Run: $run_url. Canal de último recurso (QM8-1/MAQ-4)." \
              || echo "::error::Tampoco se pudo abrir el issue de último recurso; quedan el ::error:: y el resumen del job."
          fi
