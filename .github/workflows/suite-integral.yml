name: Certificación mecánica (suite-integral)

# La certificación mecánica de la suite (7ª ronda): un job ejecuta TODOS los
# guards del registro (scripts/lib/guard-registry.sh) contra el árbol pinado
# — la lane que reproduce lo que un auditor comprobaría mecánicamente en un
# cierre — y otro ejecuta cada guard contra su fixture de fallo para probar
# que sigue mordiendo (guard-of-guards). Procedimiento y semántica en
# docs/AUDITORIA_CONTINUA.md.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/guard-fixtures/**'
      - 'versions.yaml'
      # Gitlinks de los submódulos: un re-pin cambia el árbol que los guards
      # certifican y es el momento exacto en que un guard nuevo del producto
      # aparece sin registrar (la aserción anti-fósil debe correr).
      - 'nucleus'
      - 'quark'
      - 'orbit'
      - 'website/**'
      # Lo que los guards del paraguas contrastan con el manifiesto: el go.work
      # (gowork-covers-manifest), el RUMBO (rumbo-estado) y el README
      # (manifest-guard §4/§4b).
      - 'go.work'
      - 'docs/RUMBO.md'
      - 'README.md'
      - '.github/workflows/suite-integral.yml'
  workflow_dispatch:
  schedule:
    # Lunes 06:00 UTC: sin PRs de por medio, la deriva EXTERNA (tags nuevos en
    # los remotos que dejan el pin atrás — manifest-guard §3, internal_pins)
    # solo aflora ejecutando; esta corrida la hace aflorar semanalmente.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: suite-integral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-integral:
    name: suite-integral (guards al pin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (con submódulos — son el trío que se certifica)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tags en los submódulos
        # manifest-guard §3 (merge-base tag↔pin) y check_internal_pins de
        # orbit comparan contra los tags PUBLICADOS: sin fetch explícito, el
        # clone del submódulo puede no traerlos todos.
        run: git submodule foreach 'git fetch --tags --quiet origin'

      - name: Setup Go (versión declarada en go.work)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Sin escape de declared_lags desde Quantum 1.8.0: el tren de la 7ª
      # vació la sección y la lane exige el estado certificable (lags a cero).
      - name: Certificación mecánica (todos los guards del registro)
        run: bash scripts/suite-integral.sh

  guard-of-guards:
    name: guard-of-guards (los guards muerden)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (con submódulos — las fixtures copian sus árboles)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tags en los submódulos
        # Las fixtures de manifest-guard e internal-pins clonan el submódulo
        # local con sus tags — sin tags, esas fixtures fallan en el setup.
        run: git submodule foreach 'git fetch --tags --quiet origin'

      - name: Setup Go (versión declarada en go.work)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Cada guard contra su fixture de fallo
        run: bash scripts/guard-of-guards.sh

  # QM8-1: el schedule rojo no puede morir en el email default de Actions.
  # Solo en corridas programadas (los PRs ya tienen su rojo a la vista): abre
  # o actualiza (dedupe server-side por etiqueta+título) el issue "[lane] fallo
  # del schedule suite-integral.yml <fecha>" con el enlace al run, vía GITHUB_TOKEN.
  # MAQ-4/(c): además de failure(), cubre cancelled() — un schedule cancelado
  # por `concurrency` perdía el aviso.
  notify-schedule-failure:
    name: aviso activo del schedule rojo/cancelado (issue)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [suite-integral, guard-of-guards]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (solo el script de aviso, sin submódulos)
        uses: actions/checkout@v4

      - name: Abre o actualiza el issue del fallo
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/notify_schedule_failure.sh "suite-integral.yml" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # MAQ-4/(a): si el PROPIO aviso falló, el rojo no puede degradar al email
      # default (QM8-1, insuficiente). Canal fijo de último recurso, siempre
      # visible: anotación ::error::, resumen del job, y un issue de título FIJO
      # (dedup bracket-free, independiente del canal principal que falló).
      - name: Canal de último recurso si el aviso falló
        if: always() && steps.notify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error title=Notificador del schedule caído::El aviso del schedule rojo/cancelado de suite-integral.yml FALLÓ (run: $run_url). Revisar permisos issues:write / la API de gh."
          {
            echo "## Notificador del schedule CAÍDO — suite-integral.yml"
            echo "El job de aviso no pudo abrir/actualizar su issue. Run: $run_url"
            echo "El email default de Actions no basta (QM8-1); revisa el notificador."
          } >> "$GITHUB_STEP_SUMMARY"
          # Último recurso best-effort: issue de título FIJO, dedup bracket-free.
          fixed_prefix="NOTIFICADOR CAÍDO suite-integral.yml"
          if gh issue list --state open --search "$fixed_prefix in:title" --limit 20 --json title --jq '.[].title' 2>/dev/null | grep -Fq "$fixed_prefix"; then
            echo "issue de último recurso ya abierto — no se duplica"
          else
            gh issue create --title "[lane] $fixed_prefix" \
              --body "El aviso automático del schedule de suite-integral.yml falló ANTES de registrar el rojo. Run: $run_url. Canal de último recurso (QM8-1/MAQ-4)." \
              || echo "::error::Tampoco se pudo abrir el issue de último recurso; quedan el ::error:: y el resumen del job."
          fi
