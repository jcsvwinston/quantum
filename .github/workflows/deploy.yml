name: Deploy unified docs to GitHub Pages

# Construye el sitio Docusaurus de la suite (website/) y lo publica en
# GitHub Pages del repo quantum (https://jcsvwinston.github.io/quantum/).
# El sitio ENSAMBLA las docs de cada producto desde su submódulo, así que el
# checkout debe traerlos (submodules: recursive). La fuente de las docs sigue
# viviendo en cada repo (QADR-0003): aquí solo se ensambla en build-time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (con submódulos — el sitio ensambla sus docs)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install (npm ci, desde el lock)
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      # Nada con jerga interna llega a publicarse: mismo check que website-ci,
      # aquí como última barrera antes del artefacto de Pages.
      - name: Linter de jerga sobre lo servido
        run: bash scripts/check_served_jargon.sh website/build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
