name: Website CI

# Construye el sitio Docusaurus (website/) en cada PR que lo toque, para detectar
# roturas ANTES del deploy. Hasta ahora solo deploy.yml (en push a main) construía
# el sitio, así que un cambio roto solo se veía al desplegar tras merge. Mismos
# pasos de build que deploy.yml (checkout con submódulos — el sitio ENSAMBLA sus
# docs desde cada repo, QADR-0003 —, Node 20, npm ci, npm run build), sin publicar
# nada. Un enlace roto FALLA el build (onBrokenLinks: 'throw', desde la 6ª
# ronda); los anchors rotos siguen en 'warn' (onBrokenAnchors) — el check falla
# ante roturas reales (links, config, deps, SSG), no ante warnings de anchor.

on:
  pull_request:
    paths:
      - 'website/**'
      - 'versions.yaml'        # la config lee ../versions.yaml en build-time
      # Gitlinks de los submódulos: un re-pin cambia lo que el sitio ensambla
      # y sirve, y es el momento exacto en que las sidebars espejadas pueden
      # quedar desincronizadas (QM7-4) — el build y sus gates deben correr.
      - 'nucleus'
      - 'quark'
      - 'orbit'
      - '.github/workflows/website-ci.yml'
      # El guard de coste del quickstart y su parser corren aquí sobre la
      # fuente: un cambio en ellos tiene que verse en esta lane.
      - 'scripts/check_quickstart_cost.sh'
      - 'scripts/check_quickstart_embeds.sh'
      - 'scripts/lib/quickstart-fences.sh'
  workflow_dispatch:

permissions:
  contents: read

# En PRs, cancela runs superados por un push nuevo a la misma rama.
concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Docusaurus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (con submódulos — el sitio ensambla sus docs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install (npm ci, desde el lock)
        working-directory: website
        run: npm ci

      # QM7-4: las sidebars espejadas (sidebarsNucleus/Quark.ts) son copias
      # manuales del sidebar de cada producto; este check compara los sets de
      # ids con el submódulo PINADO antes de construir, para que una página
      # nueva del producto no se sirva invisible en la navegación del paraguas.
      - name: Sincronía de sidebars espejadas
        run: bash scripts/check_sidebar_sync.sh

      # Arco A2: el quickstart de la suite cabe en 5 comandos y 5 conceptos
      # declarados (`concepts:` en el front matter). Se cuenta sobre la FUENTE
      # antes del build, con el parser que la lane quickstart-smoke usa para
      # ejecutar los curl de la misma página. Mientras el nucleus pinado no
      # registre `nucleus new --with` (leído de su new.go, el mismo predicado
      # que enciende la lane) el guard mide e informa; en cuanto el pin lo
      # traiga, exige (cabecera del script). Necesita el submódulo.
      - name: Coste del quickstart (comandos y conceptos)
        run: bash scripts/check_quickstart_cost.sh website/docs/quickstart.md

      # Arco A2: lo que el quickstart EMBEBE (fences ```go file=<rootDir>/…```
      # resueltas por remark-code-import contra el submódulo nucleus) existe
      # al pin y dice lo que la prosa explica (`embeds:` del front matter +
      # regex de jerga del guard servido). Antes del build y sobre el pin: un
      # submódulo por detrás de la página deja el build VERDE con el listado
      # viejo bajo el párrafo nuevo (built-codeblocks sólo ve bloques vacíos).
      # Rojo aquí con el pin viejo es la información: la página sólo entra
      # con el PR del set que re-pina nucleus.
      - name: Embeds del quickstart (existen al pin y dicen lo que la prosa explica)
        run: bash scripts/check_quickstart_embeds.sh website/docs/quickstart.md

      - name: Build
        working-directory: website
        run: npm run build

      # El gate de docs se pasa sobre lo que el lector VE (HTML emitido), no
      # sobre la fuente — QM5-1: el sitio sirvió snapshots con jerga durante
      # semanas con el linter de fuente en verde.
      - name: Linter de jerga sobre lo servido
        run: bash scripts/check_served_jargon.sh website/build

      # C8 (auditoría 2026-09-03): afirmaciones RETIRADAS («-tags mssql»,
      # «build tags», «single Go module», «Nine modules») en el HTML servido
      # como vigente — el sitio sirvió siete páginas de nucleus con los build
      # tags que el set 1.26.0 retiró. Snapshots versionados y release notes
      # fuera del gate con porqué (cabecera del script).
      - name: Afirmaciones retiradas sobre lo servido
        run: bash scripts/check_retired_claims.sh website/build

      # SD-01: bloques de código VACÍOS en el HTML servido (fence file=… sin
      # resolver) — el build sale verde igual.
      - name: Bloques de código vacíos sobre lo servido
        run: bash scripts/check_built_codeblocks.sh website/build

      # Docusaurus verifica sus enlaces internos, pero no mira los `<a href>`
      # externos: los «Edit this page» de las tres instancias estuvieron rotos
      # meses con el build en verde. Aquí se resuelven contra el checkout de
      # cada repo — sin red, así que ni credenciales ni rate-limit.
      - name: Enlaces del sitio construido
        run: bash scripts/check_built_links.sh website/build
