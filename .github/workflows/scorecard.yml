name: OpenSSF Scorecard

# Mide la higiene de cadena de suministro de ESTE repositorio con OpenSSF
# Scorecard y sube el resultado a code scanning. Es una lane de MEDIDA, no un
# guard: no impone umbral y su rojo sólo significa que la corrida falló, no
# que la nota bajó. El guard que lea la nota llega en un PR posterior del
# arco A3 —y sólo tendrá sentido cuando exista una primera medida contra la
# que comparar, que es justo lo que este workflow produce.
#
# Semanal + a mano. Scorecard puntúa el repositorio, no el commit: correrlo en
# cada push mediría lo mismo veinte veces al día y gastaría cuota de API sin
# cambiar el veredicto. El lunes 07:00 UTC va una hora después del cron de
# suite-integral (06:00), para no solapar dos lanes largas.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# El workflow entero lee. La escritura baja al único job, que la necesita para
# subir el SARIF a code scanning (`security-events: write`). Un bloque de job
# SUSTITUYE al del workflow, no se suma: por eso el job vuelve a nombrar las
# lecturas que usa (ver docs/AUDITORIA_CONTINUA.md §7).
permissions: read-all

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: análisis de Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Subir el SARIF al panel de code scanning.
      security-events: write
      # Acuñar el OIDC con el que la acción publica en el dataset público de
      # OpenSSF. Hoy NO se ejerce: `publish_results` está en false y sin
      # publicación la acción no pide token. Queda declarado porque es lo que
      # la acción documenta como requisito y porque el día que el propietario
      # decida publicar, el cambio es una línea y no un permiso nuevo.
      id-token: write
      # Lecturas que el job usa de verdad: el checkout y la lectura de los
      # workflows y de las corridas de Actions que hacen varias
      # comprobaciones (Token-Permissions, Pinned-Dependencies, CI-Tests).
      contents: read
      actions: read
    steps:
      - name: Checkout (sin submódulos — Scorecard puntúa ESTE repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ejecuta Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publicar la nota en el dataset público de OpenSSF (y con ella el
          # badge) es una decisión del propietario que no está tomada. Hasta
          # que lo esté, la primera nota se lee de la propia corrida: del log
          # del paso y del artefacto `scorecard-results` de abajo.
          publish_results: false

      # El artefacto es la vía de lectura que no depende de la interfaz de
      # code scanning: `gh run download <run-id> -n scorecard-results` deja el
      # SARIF, y de ahí salen la nota agregada y el detalle por comprobación.
      - name: Guarda el SARIF como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Sube el SARIF a code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

  # QM8-1: el schedule rojo no puede morir en el email default de Actions. Es
  # regla del paraguas y no una cortesía de las otras dos lanes: toda lane con
  # disparador `schedule:` lleva este job (docs/AUDITORIA_CONTINUA.md §7), y
  # el guard `umbrella-schedule-notify` lo exige por mecánica.
  # Aquí la regla muerde en el propósito de la propia lane: existe para
  # PRODUCIR una medida, y un lunes que falle en silencio —cuota de la API,
  # subida del SARIF rechazada, bump de la acción— no deja medida y nadie se
  # entera hasta el lunes siguiente.
  # MAQ-4/(c): además de failure(), cubre cancelled() — un schedule cancelado
  # por `concurrency` perdía el aviso.
  # RT-8: `needs` lista TODOS los demás jobs del workflow — failure() solo mira
  # la cadena de dependencias. Al añadir un job aquí, añadirlo a esta lista.
  notify-schedule-failure:
    name: aviso activo del schedule rojo/cancelado (issue)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [analysis]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (solo el script de aviso, sin submódulos)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Abre o actualiza el issue del fallo
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/notify_schedule_failure.sh "scorecard.yml" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # MAQ-4/(a): si el PROPIO aviso falló, el rojo no puede degradar al email
      # default (QM8-1, insuficiente). Canal fijo de último recurso, siempre
      # visible: anotación ::error::, resumen del job, y un issue de título FIJO
      # (dedup bracket-free, independiente del canal principal que falló).
      - name: Canal de último recurso si el aviso falló
        if: always() && steps.notify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error title=Notificador del schedule caído::El aviso del schedule rojo/cancelado de scorecard.yml FALLÓ (run: $run_url). Revisar permisos issues:write / la API de gh."
          {
            echo "## Notificador del schedule CAÍDO — scorecard.yml"
            echo "El job de aviso no pudo abrir/actualizar su issue. Run: $run_url"
            echo "El email default de Actions no basta (QM8-1); revisa el notificador."
          } >> "$GITHUB_STEP_SUMMARY"
          # Último recurso best-effort: issue de título FIJO, dedup bracket-free.
          fixed_prefix="NOTIFICADOR CAÍDO scorecard.yml"
          if gh issue list --state open --search "$fixed_prefix in:title" --limit 20 --json title --jq '.[].title' 2>/dev/null | grep -Fq "$fixed_prefix"; then
            echo "issue de último recurso ya abierto — no se duplica"
          else
            gh issue create --title "[lane] $fixed_prefix" \
              --body "El aviso automático del schedule de scorecard.yml falló ANTES de registrar el rojo. Run: $run_url. Canal de último recurso (QM8-1/MAQ-4)." \
              || echo "::error::Tampoco se pudo abrir el issue de último recurso; quedan el ::error:: y el resumen del job."
          fi
