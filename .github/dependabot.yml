# Dependabot del paraguas (C6, auditoría 2026-09-03). Aquí no hay go.mod
# propio —el root del workspace no es un módulo— así que solo hay dos
# ecosistemas que mantener: las Actions de los workflows y el npm del sitio.
# Los módulos Go los vigila el CI de cada producto (govulncheck) y su propio
# Dependabot.
version: 2
updates:
  # Las referencias `uses:` están fijadas por SHA de commit con su tag en el
  # comentario (`@<40 hex> # v7.0.1`, arco A3). Este bloque es lo que evita
  # que ese pin se fosilice: Dependabot lee el comentario para saber en qué
  # versión está, y cuando sale una nueva reescribe SHA y comentario a la vez.
  # Sin bot, el pin congela también los fallos de seguridad de esa versión —
  # por eso el pin y este bloque son una sola decisión, no dos. Que ninguna
  # referencia vuelva al tag móvil lo verifica scripts/check_actions_pinned.sh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    # Docusaurus se sube a mano y de una vez (core + preset + theme + types van
    # en lockstep); Dependabot solo propone el resto. Sin este ignore abriría
    # un PR por paquete y ninguno compilaría solo.
    ignore:
      - dependency-name: "@docusaurus/*"
      # Peer opcional de @docusaurus/theme-mermaid (^0.1.9): sube con
      # Docusaurus, no solo. Un bump a 0.2 rompió `npm ci` (ERESOLVE, #139).
      - dependency-name: "@mermaid-js/layout-elk"
      # TypeScript major: Docusaurus 3.10 y sus tipos declaran <6; el 7 que
      # agrupó #139 no resuelve. Se sube a mano con Docusaurus.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      website-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(website)"
    labels: [dependencies]
