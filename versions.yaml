# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.25.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-31
status: certified           # Auditoría integral de producto/DX ejecutada: los 3 P0 del embudo de entrada cerrados y verificados, puerta de entrada de suite en el sitio, y la cadencia de certificación desacoplada de los arcos (QADR-0008)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.9.0"
  nucleus: "v1.23.0"
  orbit:   "v1.8.15"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.0"
  mysql:         "v0.1.0"
  oracle:        "v0.1.0"
  postgres:      "v0.1.0"
  sqlite:        "v0.1.0"
  otlp:          "v0.1.0"
  prometheus:    "v0.1.0"
  ldap:          "v0.2.4"
  secrets-aws:   "v0.1.0"
  storage-azure: "v0.1.0"
  storage-gcs:   "v0.1.0"
  storage-s3:    "v0.1.0"

# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  mssql:    "v0.1.0"
  mysql:    "v0.1.0"
  oracle:   "v0.1.0"
  postgres: "v0.1.0"
  sqlite:   "v0.1.0"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.6.10"
  server:          "v0.10.10"
  quarkbridge:     "v0.4.10"
  quarkdatasource: "v0.2.19"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "4fc7ffa8"                                # = v1.9.0 exacto
  nucleus: "253ec05c"                                # = v1.23.0 exacto (y = providers/ldap/v0.2.4: los dos tags se cortaron en el MISMO commit, que es lo que permite certificar el módulo — ver manifest-guard §3b)
  orbit:   "254e2695"                                # = v1.8.15 exacto (contiene server/v0.10.10, agent/v0.6.10, proto/v0.4.2, quarkbridge/v0.4.10, quarkdatasource/v0.2.19 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.25.0 — el set que lleva al público la auditoría integral de
  producto y DX (quark v1.8.0; nucleus v1.22.0 con providers/ldap v0.2.4;
  orbit v1.8.14 con agent v0.6.9, server v0.10.9, quarkbridge v0.4.9,
  quarkdatasource v0.2.18). Los tres defectos que un evaluador pisaba en su
  primera hora quedan cerrados y verificados: el quickstart de nucleus se
  publicaba con sus bloques de código VACÍOS en las trece versiones del
  sitio, `nucleus generate module` generaba una app que paniqueaba al
  arrancar con cualquier nombre ya plural, y el Data Studio sobre quark
  renderizaba «—» en todas las celdas del propio ejemplo certificado.
  El sitio estrena además una puerta de entrada de suite —una sección
  /start con qué es Quantum, un quickstart de los tres productos juntos y
  la página que dice cómo instalar el set— y las primeras capturas reales
  del panel. Del lado del código: quark expone NewWithDB para montarse
  sobre el pool que la aplicación ya tiene, valida columnas contra el
  modelo y deja filtrar por columnas cualificadas bajo un JOIN; nucleus
  elige líder para el scheduler de jobs (cada réplica duplicaba los ticks),
  completa i18n y caché —que eran comandos sin runtime— y trae una receta
  de login de punta a punta; orbit dice su propio nombre, redacta los
  tokens de sesión, arregla una carrera de datos y pinta por fin el SQL que
  su feed prometía. La cadencia de certificación pasa a ser semanal y
  desacoplada de los arcos (QADR-0008), el tren se conduce con
  scripts/train/ y la alineación de los seis módulos de orbit cabe en un
  commit.
