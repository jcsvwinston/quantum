# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.14.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-23
status: certified           # Arco vertical slices (ADR-022 de nucleus): módulos auto-autorizables (Policies/CSRFExempt), migraciones embebidas aplicables (Runtime.ApplyModuleMigrations), plantillas por módulo (WithTemplatesFS) y generate module; quark v1.5.2 arregla migrate up (aplicaba solo 1 pendiente); minor de nucleus (v1.9.1→v1.10.0) fuerza el minor de suite (QADR-0002)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.5.2"
  nucleus: "v1.10.0"
  orbit:   "v1.6.5"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.5.13"
  server:          "v0.9.9"
  quarkbridge:     "v0.3.12"
  quarkdatasource: "v0.2.11"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "5d60b090"                                # = v1.5.2 exacto
  nucleus: "4288f48c"                                # = v1.10.0 exacto
  orbit:   "0ce0910a"                                # = v1.6.5 exacto (contiene server/v0.9.9, agent/v0.5.13, proto/v0.4.2, quarkbridge/v0.3.12, quarkdatasource/v0.2.11 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.14.0 — Arco vertical slices (ADR-022 de nucleus, v1.10.0): un
  módulo montado lleva ahora TODO lo que su feature necesita. §1 Policies y
  CSRFExempt declarables (filas RBAC relativas al Prefix, solo in-memory; un
  deny del CSV anfitrión anula cualquier allow de módulo); §2 las Migrations
  embebidas se aplican con una llamada deliberada (Runtime.ApplyModuleMigrations,
  ledger con namespace por módulo + checksums, idempotente; el boot sigue sin
  mutar esquema por sí solo — ADR-013 §R1); §3 Templates fs.FS por módulo bajo
  su namespace (app.WithTemplatesFS, acumulativo; templates_dir del anfitrión
  gana la colisión); §4 nucleus generate module emite el slice
  paquete-por-feature autocontenido — el E2E del guard de scaffold arranca sin
  migrate y sin tocar rbac_policy.csv. quark v1.5.2: migrate up sin --steps
  aplicaba SOLO la primera migración pendiente (default del flag compartido
  entre up/down) y salía 0 — clase «exit 0 sin efecto». orbit v1.6.5:
  alineación de deps al set completa en dos pasos cazados por los guards
  (v1.6.3 dejó agent en nucleus v1.9.1 — manifest-guard §5; v1.6.4 dejó a
  server pinando agent v0.5.12 — orbit-internal-pins): server v0.9.9,
  agent v0.5.13, quarkbridge v0.3.12, quarkdatasource v0.2.11, proto sin
  cambios. Además: los 206
  enlaces «Edit this page» del sitio publicado estaban rotos (editUrl string)
  y quedaron corregidos con editUrl-función por instancia. Nombre 1.14.0
  (minor): el minor de nucleus arrastra el número de suite (QADR-0002). El
  historial narrativo completo vive en CHANGELOG.md.
