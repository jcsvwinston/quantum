# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.20.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-28
status: certified           # Arcos B y C del plan de extensibilidad: un proveedor registrado declara su configuración, la superficie de extensión queda acotada y congelada, y la cadena de autenticación se declara desde la config consumiendo UserProvider — con el panel de orbit autenticando por ella sin delegar la autorización

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.6.1"
  nucleus: "v1.15.0"
  orbit:   "v1.8.1"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  ldap: "v0.1.0"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.6.0"
  server:          "v0.10.0"
  quarkbridge:     "v0.4.0"
  quarkdatasource: "v0.2.14"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "7fa5eb80"                                # = v1.6.1 exacto
  nucleus: "1776e70c"                                # = v1.15.0 exacto (y = providers/ldap/v0.1.0: los dos tags se cortaron en el MISMO commit, que es lo que permite certificar el módulo — ver manifest-guard §3b)
  orbit:   "215e5c4e"                                # = v1.8.1 exacto (contiene server/v0.10.0, agent/v0.6.0, proto/v0.4.2, quarkbridge/v0.4.0, quarkdatasource/v0.2.14 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags:
  # providers/ldap v0.1.0 se publicó requiriendo una PSEUDO-VERSIÓN del
  # framework: la API que consume (la configuración por backend de
  # autenticación) solo existía en main cuando se escribió el módulo, porque
  # el módulo y esa API viajaron en el mismo tren. Verificado como consumidor
  # real —`go get` del tag, import por efecto, RegisteredBackends() imprime
  # [ldap]—: funciona, y MVS eleva la versión en cualquier aplicación que
  # además requiera v1.15.0. Se declara en vez de taparse.
  # main YA está re-pinado a v1.15.0; el corte de ese arreglo va DENTRO de la
  # próxima release de la raíz, no detrás de ella (§3b explica por qué).
  nucleus: "v1.14.1-0.20260827172321-32cceb4a3921"

notes: >
  Quantum 1.19.0 — Arcos B y C del plan de extensibilidad (nucleus v1.14.0,
  orbit v1.8.1). §1 un proveedor REGISTRADO declara su propia configuración:
  el Arco A dejaba enchufar un backend por nombre pero no configurarlo,
  porque storage.ceph.endpoint moría como clave desconocida antes de que el
  proveedor llegara a correr — un backend que nadie puede configurar es un
  backend que nadie puede desplegar. La exención del guard es SOLO para
  nombres registrados: un typo bajo storage. sigue fallando, o el namespace
  se convertiría en un agujero donde cualquier errata pasa. §2 la superficie
  que una extensión puede tocar deja de ser un cheque en blanco: el contrato
  decía que podía «asignar campos en App», así que lo que tocara se volvía
  API de hecho sin estar cubierto por nada prometible entre versiones — y no
  lo usaba nadie (el único consumidor real lee cinco campos y no escribe
  ninguno). Ahora lee, y lo que puede leer está congelado junto a los
  símbolos, los comandos y las claves. §3 la cadena de autenticación se
  declara con auth_backends y consume por fin auth.UserProvider, que llevaba
  desde v0.x declarado, CONGELADO en el baseline y llamado por nadie. Un
  backend no registrado rompe el ARRANQUE y no el primer login, que es el
  peor momento para descubrir una errata en una lista de autenticación. §4
  el panel de orbit autentica por esa cadena: quien configuró un directorio
  corporativo obtiene login de directorio sin que orbit lleve un cliente
  LDAP dentro. Delega la AUTENTICACIÓN, no la autorización — un usuario del
  directorio que no esté dado de alta como admin se rechaza, porque sin esa
  frontera conectar un directorio convertiría en silencio a toda la
  plantilla en administradora del panel. Y al revés: una fila local no es un
  bypass, la cadena sigue teniendo que aceptar la contraseña, así que una
  cuenta revocada no entra por una fila rancia. La temporización se cuidó en
  los dos sitios: el trabajo caro corre en TODOS los caminos antes de
  decidir, o «no eres admin» respondería más rápido que «contraseña mala» y
  volveríamos a publicar el enumerador de usuarios por otra puerta. quark
  v1.6.1 sin cambios. §5 de propina, la certificación destapó que
  orbit/quarkdatasource requería el root dos minors por detrás: dentro del
  repo no se nota —el workspace resuelve el root desde el checkout— pero
  quien instalaba ese módulo se llevaba de paso un root viejo. La excepción
  que tolera un minor de lag en esa arista existe por una razón topológica
  real, pero lo hacía imprimiendo una línea «ok» indistinguible de un pin al
  día, así que el pin se pudrió un ciclo entero sin que nadie lo viera y el
  guard sólo se puso rojo TARDE, en plena certificación, donde deshacerlo
  cuesta un tag de root nuevo. Ahora avisa mientras el lag existe. El
  historial narrativo completo vive en CHANGELOG.md.
