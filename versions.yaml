# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "0.1.0-dev"        # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-06-22
status: pre-fusion          # CI de integración ya en verde; falta certificar el trío (pines a tag) para Quantum 0.1.0

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
modules:
  quark:   "v1.1.5"
  nucleus: "v0.9.0"
  orbit:   "v0.1.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work` compile
# el trío. Coinciden con la versión publicada de `modules`, EXCEPTO nucleus y orbit:
# - Nucleus: fijado al main que expone el ingest SQL público (EventBus.EmitSQL,
#   su ADR-020) + el bump de seguridad de pgx (GO-2026-5004). Es la línea que
#   orbit/quarkbridge requiere en su go.mod. v0.9.0 sigue siendo la versión real
#   PUBLICADA; el commit fijado es pre-release de la futura v0.9.1/v0.10.0.
# - Orbit: fijado al main que trae los dos work-items de QADR-0006 fusionados:
#   quarkbridge (feed SQL Quark→bus, Caso 1) y el contrato datasource de Data
#   Studio (su ADR-001, prerrequisito del Caso 2). v0.1.0 sigue siendo la versión
#   PUBLICADA (modules.orbit). Ambos pines se limpiarán a tag cuando cada producto
#   corte release (release-please, Fase 3).
workspace_pins:
  quark:   "v1.1.5"                                  # = tag
  nucleus: "v0.9.1-0.20260701170204-a46fad0ec1e3"    # commit a46fad0e (EmitSQL ADR-020 + pgx v5.9.2)
  orbit:   "v0.1.1-0.20260702164514-782b388c93f8"    # commit 782b388 (quarkbridge + datasource ADR-001)

notes: >
  Trío declarado al crear el paraguas (Fase 0). Las versiones de `modules` son
  las reales publicadas de cada módulo; `workspace_pins` es lo que el go.work
  checkea para compilar. El primer set VERIFICADO por CI de integración será
  Quantum 0.1.0 en la Fase 3; ahí Nucleus taggeará la línea que Orbit ya consume
  y tanto `workspace_pins.nucleus` como `workspace_pins.orbit` pasarán a ser tags.
  La CI de integración ya existe (.github/workflows/integration.yml, en verde).
