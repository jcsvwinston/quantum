# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.27.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-05
status: certified           # Minor de suite por la minor de orbit (QADR-0002): ADR-006, server deja de requerir agent y se acaba la cascada de pines internos. Corte fuera de cadencia con razón escrita (QADR-0008): publicar esa decisión antes del tren del lunes

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.10.1"
  nucleus: "v1.23.2"
  orbit:   "v1.9.0"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.1"
  mysql:         "v0.1.1"
  oracle:        "v0.1.1"
  postgres:      "v0.1.1"
  sqlite:        "v0.1.1"
  otlp:          "v0.1.1"
  prometheus:    "v0.1.1"
  ldap:          "v0.2.5"
  secrets-aws:   "v0.1.1"
  storage-azure: "v0.1.1"
  storage-gcs:   "v0.1.1"
  storage-s3:    "v0.1.1"

# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  mssql:    "v0.1.1"
  mysql:    "v0.1.1"
  oracle:   "v0.1.1"
  postgres: "v0.1.1"
  sqlite:   "v0.1.1"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.4"
  agent:           "v0.6.14"
  server:          "v0.11.0"
  quarkbridge:     "v1.8.19"
  quarkdatasource: "v1.8.19"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "6d7d661e"                                # = v1.10.1 exacto (contiene drivers/mssql/v0.1.1, drivers/mysql/v0.1.1, drivers/oracle/v0.1.1, drivers/postgres/v0.1.1, drivers/sqlite/v0.1.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "69af0f18"                                # = v1.23.2 exacto (contiene drivers/mssql/v0.1.1, drivers/mysql/v0.1.1, drivers/oracle/v0.1.1, drivers/postgres/v0.1.1, drivers/sqlite/v0.1.1, exporters/otlp/v0.1.1, exporters/prometheus/v0.1.1, providers/ldap/v0.2.5, providers/secrets-aws/v0.1.1, providers/storage-azure/v0.1.1, providers/storage-gcs/v0.1.1, providers/storage-s3/v0.1.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "577d90be"                                # = v1.9.0 exacto (contiene agent/v0.6.14, proto/v0.4.4, quarkbridge/v1.8.19, quarkdatasource/v1.8.19, server/v0.11.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.27.0 — la minor que publica ADR-006 de orbit. Solo se mueve
  orbit, de v1.8.25 a v1.9.0 (server v0.10.17 → v0.11.0; proto v0.4.4,
  agent v0.6.14 y los dos puentes v1.8.19 sin cambio); quark v1.10.1 y
  nucleus v1.23.2 con sus módulos siguen donde estaban. Minor de suite
  porque lo es la de orbit (QADR-0002), y corte fuera de cadencia con la
  razón escrita que pide QADR-0008: publicar la decisión antes de que el
  tren del lunes vuelva a pagar la cascada.

  Lo que decide ADR-006: ningún módulo hermano de orbit requiere a otro por
  tag salvo proto, el contrato del protocolo. server importaba agent solo
  desde cuatro tests que arrancan un agente real; esos tests viven ahora en
  orbit/internal/fleettest, un módulo de solo test que la regla internal
  de Go hace inimportable desde fuera del repositorio y que nunca se
  publica. proto pasa a ser hoja deliberada (Dependabot no toca sus
  dependencias Go; se suben con la regeneración de los stubs), y los
  bumps de Dependabot en los módulos publicados llevan fix(deps) para que
  su tag salga en el mismo tren.

  Por qué importaba: los módulos del fleet se cortan del mismo commit, así
  que cada uno nacía requiriendo el tag anterior de su hermano y el guard
  de pines internos —con razón: go install resuelve por el suelo del
  go.mod— exigía un corte por nivel de la cadena. De los ocho cortes de
  raíz de orbit del 4 y 5 de septiembre, cinco no publicaron ningún cambio
  de producto. Coste esperado desde este set: un cambio en agent o server,
  un corte; en proto, dos, y el segundo lo hace el driver del tren.

  Lo que cambia para quien instala: nada en el binario admin-server; el
  go.mod de server deja de arrastrar agent. Para el paraguas: internal/*
  queda fuera del descubrimiento de módulos del manifest-guard y
  orbit/internal/fleettest entra en el go.work con este re-pin (antes no
  podía: el pin no lo contenía). El tren gana tres scripts que
  condujeron el set anterior: orbit-converge, untag-recipe y merge-group.
