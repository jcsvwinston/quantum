# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.3.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-12
status: certified           # cierre de auditoría: el endurecimiento de nucleus/orbit queda PUBLICADO por tag y pinado

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración y pata fleet (repo orbit), en tag y resolubles
# standalone: quarkbridge v0.3.1, quarkdatasource v0.2.2, proto v0.3.0,
# agent v0.4.0, server v0.6.0 (binario admin-server instalable con go install).
# Los puentes requieren quark v1.2.1 desde sus tags nuevos: el set certificado
# también es coherente resuelto standalone (cerrado H-U5).
modules:
  quark:   "v1.2.1"
  nucleus: "v1.2.0"
  orbit:   "v1.2.1"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto — sin matices esta vez.
workspace_pins:
  quark:   "8ff89a1f"                                # = v1.2.1 exacto
  nucleus: "8ad8676f"                                # = v1.2.0 exacto
  orbit:   "a345701"                                 # = v1.2.1 exacto (los tags de puentes/server posteriores solo añaden changelog/manifiesto; el código de módulo es el de este commit)

notes: >
  Quantum 1.3.0 — el set del cierre de auditoría: los endurecimientos de
  seguridad que vivían solo en main quedan publicados por tag y pinados.
  Nucleus v1.2.0 (minor de endurecimiento con "Behavior changes"
  señalizados: jwt_secret exige >=32 bytes al arrancar, X-Forwarded-For /
  X-Real-IP se ignoran salvo desde trusted_proxies, HSTS solo sobre TLS;
  ademas `nucleus new` fija v1.2.0 en los scaffolds, el sitio corta el
  snapshot de docs 1.2.0 y /metrics documenta que no lleva auth propia).
  Orbit v1.2.1 (parametriza el INSERT del bootstrap admin) + server
  v0.6.0 (el admin-server se niega a arrancar el listener de agentes en
  interfaz no-loopback sin token/TLS — --insecure-agent-listener para
  forzar — y el trusted-proxy del UI exige X-Auth-Proxy-Secret). Quark
  v1.2.1 continúa del set 1.2.1 (sin cambios; sus notas en ese release).
  Los puentes suben a quarkbridge v0.3.1 / quarkdatasource v0.2.2, que
  requieren quark v1.2.1. Verificación en vivo del cierre: fail-closed
  del admin-server comprobado ejecutando el binario (exit 1 sin auth;
  401/200 en el trusted-proxy), 7/7 tests de hardening de nucleus.
  Alcance del CI del paraguas: integration.yml verifica build + vet del
  trío pinado y el lane de lockstep con los tests de Orbit (A-7); las
  afirmaciones de producto de estas notas se verificaron en el CI y los
  repos de cada módulo, no las re-comprueba este repo.
