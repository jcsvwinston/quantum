# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "0.5.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-10
status: certified           # quinto set certificado (0.5.0): NUCLEUS EN MAJOR 1

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración (repo orbit): quarkbridge v0.1.0 y
# quarkdatasource v0.1.0 — también taggeados y resolubles standalone.
modules:
  quark:   "v1.1.5"
  nucleus: "v1.0.0"
  orbit:   "v0.3.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG. El RC de v1.0.0 pasó la validación
# de lockstep A-7 (quantum#39) antes del tag del primer major.
workspace_pins:
  quark:   "v1.1.5"                                  # = tag
  nucleus: "v1.0.0"                                  # = tag (PRIMER MAJOR)
  orbit:   "v0.3.0"                                  # = tag

notes: >
  Quantum 0.5.0 — quinto set certificado y el hito de la Fase 5: NUCLEUS
  ALCANZA SU PRIMER MAJOR (v1.0.0). El gate quedó íntegro: §A completo
  (17 pkgs estables congelados, deuda de deprecación pagada, CORS deny por
  defecto, SLO medible, lockstep operativo), 6 waivers §B aprobados y
  documentados, rehearsal y artefactos del checklist en verde, y el RC
  validado por el lane A-7. Dos de los tres pilares están en major 1
  (quark v1.1.5, nucleus v1.0.0). Camino restante a Quantum 1.0: orbit a
  v1.0 en lockstep (freeze del contrato datasource, repin a nucleus v1.0,
  su mini-gate) y la certificación del manifiesto 1.0.0 (QADR-0005).
