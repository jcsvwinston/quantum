# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.3.1"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-13
status: certified           # backlog de auditoría de quark v1.2.1 ejecutado y publicado en quark v1.2.2

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración y pata fleet (repo orbit), en tag y resolubles
# standalone: quarkbridge v0.3.1, quarkdatasource v0.2.2, proto v0.3.0,
# agent v0.4.0, server v0.6.0 (binario admin-server instalable con go install).
# Los puentes requieren quark v1.2.1 desde sus tags nuevos: el set certificado
# también es coherente resuelto standalone (cerrado H-U5).
modules:
  quark:   "v1.2.2"
  nucleus: "v1.2.0"
  orbit:   "v1.2.1"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto — sin matices esta vez.
workspace_pins:
  quark:   "fc81f4cf"                                # = v1.2.2 exacto
  nucleus: "8ad8676f"                                # = v1.2.0 exacto
  orbit:   "a345701"                                 # = v1.2.1 exacto (los tags de puentes/server posteriores solo añaden changelog/manifiesto; el código de módulo es el de este commit)

notes: >
  Quantum 1.3.1 — quark sube a v1.2.2: la ejecución del backlog de la
  auditoría v1.2.1 (quark#242/#243/#245/#246). Los cuatro P0 cerrados
  (inyección SQL en `quark tenant provision`; `Count()`/`Paginate` sobre
  UNION/INTERSECT/EXCEPT contaban solo el operando base; panic de
  Upsert/UpsertBatch con conflictCols vacío — ahora ErrInvalidQuery en
  los 6 motores; Offset sin Limit perdido en MySQL/roto en
  SQLite/MariaDB — sentinels correctos). CLI honesta: migrate up/seed
  run con registro vacío avisan y salen non-zero, `validate` carga los
  structs reales con go/packages, `tenant migrate` resuelve el DSN del
  tenant (tenant.dsn_template), flags fantasma retirados, init valida
  el dialecto. Batching con techos por dialecto (~65k PG/MySQL/MariaDB,
  ~32k SQLite, ~2100 MSSQL) y UpsertBatch chunkeado; Upsert en MSSQL
  back-fillea el PK vía OUTPUT INSERTED (Oracle documentado como
  limitación); INTERSECT/EXCEPT habilitados en MariaDB 10.3+. Docs:
  falsedades fósiles corregidas (aviso de savepoint invertido, Cast
  inexistente, versión del roadmap), requisito pgx del listener
  documentado, referencia de opciones completa, snapshots 1.2.1 y
  1.2.2 congelados. QK-P2-7 (modo estricto) diferido con diseño en
  quark#247. Nucleus v1.2.0 y orbit v1.2.1 continúan del set 1.3.0 sin
  cambios. Verificación: go install …cmd/quark@v1.2.2 → `quark
  version` = v1.2.2 y `migrate up` sin registro sale 1 con la receta
  de embebido; matriz de 6 motores del CI de quark en verde en los 4
  PRs (la celda MariaDB ejercita ahora INTERSECT/EXCEPT reales).
