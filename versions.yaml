# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.29.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-08
status: certified           # Minor de suite por las minors de quark y nucleus (QADR-0002): el arco A2 (starter de suite y primer endpoint en cinco comandos) publicado; corte en cadencia (QADR-0008)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.12.0"
  nucleus: "v1.25.0"
  orbit:   "v1.9.3"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.3"
  mysql:         "v0.1.3"
  oracle:        "v0.1.3"
  postgres:      "v0.1.3"
  sqlite:        "v0.1.3"
  otlp:          "v0.1.3"
  prometheus:    "v0.1.3"
  ldap:          "v0.2.7"
  secrets-aws:   "v0.1.3"
  storage-azure: "v0.1.3"
  storage-gcs:   "v0.1.3"
  storage-s3:    "v0.1.3"

# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  mssql:    "v0.1.3"
  mysql:    "v0.1.3"
  oracle:   "v0.1.3"
  postgres: "v0.1.3"
  sqlite:   "v0.1.3"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.4"
  agent:           "v0.6.17"
  server:          "v0.11.3"
  quarkbridge:     "v1.8.21"
  quarkdatasource: "v1.8.22"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "c59850ac"                                # = v1.12.0 exacto (contiene drivers/mssql/v0.1.3, drivers/mysql/v0.1.3, drivers/oracle/v0.1.3, drivers/postgres/v0.1.3, drivers/sqlite/v0.1.3 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "2e46aca6"                                # = v1.25.0 exacto (contiene drivers/mssql/v0.1.3, drivers/mysql/v0.1.3, drivers/oracle/v0.1.3, drivers/postgres/v0.1.3, drivers/sqlite/v0.1.3, exporters/otlp/v0.1.3, exporters/prometheus/v0.1.3, providers/ldap/v0.2.7, providers/secrets-aws/v0.1.3, providers/storage-azure/v0.1.3, providers/storage-gcs/v0.1.3, providers/storage-s3/v0.1.3 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "f8416446"                                # = v1.9.3 exacto (contiene agent/v0.6.17, proto/v0.4.4, quarkbridge/v1.8.21, quarkdatasource/v1.8.22, server/v0.11.3 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.29.0 — la minor que publica el arco A2: una aplicación de suite
  a un comando y el primer endpoint en cinco. quark v1.11.0 → v1.12.0
  (drivers/* v0.1.3), nucleus v1.24.0 → v1.25.0 (sus doce módulos: once en v0.1.3 y providers/ldap v0.2.7)
  y orbit v1.9.2 → v1.9.3 (agent v0.6.17, server v0.11.3, quarkbridge
  v1.8.21, quarkdatasource v1.8.22, proto v0.4.4: alineación de pines a
  los dos, sin cambio de producto). Minor de suite porque lo son las de quark y nucleus
  (QADR-0002); corte en la cadencia semanal (QADR-0008).

  Lo que publica A2. Nucleus: `nucleus new <app> --template suite --with
  orbit,quark,quarkbridge,quarkdatasource` escribe la aplicación que el
  quickstart pedía teclear (main.go con el panel de Orbit y un módulo
  shop sobre Quark, nucleus.yml, política, migración, artículo sembrado y
  test), `--db` elige el driver y deja go.mod en orden, y
  examples/showcase_demo se genera de la misma plantilla con un test que
  los mantiene idénticos; `generate module --mount` monta en main.go y
  emite test; `nucleus routes` y `migrate status` leen el binario real
  (NUCLEUS_PRINT_ROUTES, ledger por espacio de nombres); `nucleus dev`
  recompila y reinicia al cambiar (con proxy de assets y rutas impresas);
  `nucleus completion` para bash, zsh y fish; `--help` con gramática en
  catorce comandos; `openapi` falla con receta sin contratos; una ruta no
  registrada contesta 404 (los gates de authz y CSRF corren tras el
  enrutado) y un scaffold limpio arranca con cero WARN. Quark: `quark init
  --with nucleus` escribe el módulo de Nucleus y el nucleus.yml mínimo;
  ejemplos chi, echo y gin con guía de frameworks; drivers/postgres adopta
  el contrato público del listener (QK-8 cerrado del todo). Paraguas: el
  quickstart de la suite pasa a «lee lo que se generó» — cinco comandos y
  cinco conceptos, medidos por el guard quickstart-cost; los ficheros
  embebidos se atan a su contenido (quickstart-embeds); la lane
  quickstart-smoke genera, arranca y recorre el quickstart con presupuesto
  de 60 s; 39 guards en el registro. Registro de la auditoría: NU-16, NU-17,
  NU-18, NU-48 y NU-49 hechos; `arcos_cerrados: A1 A2`.

  Lo que aprendió el tren: el cuerpo por defecto de un squash puede dejar
  a release-please sin ver un feat (quark#355 → 1.11.1 con un minor en
  main); merge-group fusiona ahora con título y cuerpo controlados. Los
  pines cruzados de orbit se alinean solos antes de su fase; la deuda de
  doc de quark se paga sola en la rama del bot.

  Lo que cambia para quien instala: en nucleus, una ruta que nadie
  registra contesta 404 y no 403 (y 419 en POST); `nucleus migrate` sin
  acción es un error de uso en vez de un `up` implícito; `nucleus new`
  hace `go get` del driver y `go mod tidy` salvo `--offline`; `generate
  module` rechaza nombres que no pueden ser paquete Go. En quark y orbit,
  nada en la configuración cambia.
