# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.42.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-10-18
status: certified           # Minor de suite por la minor de nucleus y orbit (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.17.0"
  nucleus: "v1.33.0"
  orbit:   "v1.20.1"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
# La entrada `nucleus` de este bloque es el CLI (`cmd/nucleus`), módulo propio
# desde nucleus v1.32.0 (ADR-038 de nucleus) que va en LOCKSTEP con la raíz: no
# es paquete de release-please, release.yml le corta `cmd/nucleus/vX.Y.Z` en el
# commit de cada `vX.Y.Z`, y bump-set la escribe desde ese tag.
nucleus_modules:
  nucleus:       "v1.33.0"
  mssql:         "v0.1.10"
  mysql:         "v0.1.10"
  oracle:        "v0.1.10"
  postgres:      "v0.1.10"
  sqlite:        "v0.2.0"
  otlp:          "v0.1.10"
  prometheus:    "v0.1.10"
  auth-saml:     "v0.1.1"
  errors-sentry: "v0.1.1"
  ldap:          "v0.2.14"
  secrets-aws:   "v0.1.10"
  storage-azure: "v0.1.10"
  storage-gcs:   "v0.1.10"
  storage-s3:    "v0.1.10"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.2.1"
  mssql:    "v0.3.0"
  mysql:    "v0.3.0"
  oracle:   "v0.3.0"
  postgres: "v0.3.0"
  sqlite:   "v0.3.0"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  agent:           "v0.16.1"
  datasource:      "v1.1.0"
  proto:           "v0.8.1"
  quarkbridge:     "v1.9.6"
  quarkdatasource: "v1.13.1"
  server:          "v0.21.1"
  ui:              "v1.2.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "cda611bb"                                # = v1.17.0 exacto (contiene cmd/quark/v1.2.1, drivers/mssql/v0.3.0, drivers/mysql/v0.3.0, drivers/oracle/v0.3.0, drivers/postgres/v0.3.0, drivers/sqlite/v0.3.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "dff6f4db"                                # = v1.33.0 exacto (contiene drivers/mssql/v0.1.10, drivers/mysql/v0.1.10, drivers/oracle/v0.1.10, drivers/postgres/v0.1.10, drivers/sqlite/v0.2.0, exporters/otlp/v0.1.10, exporters/prometheus/v0.1.10, providers/auth-saml/v0.1.1, providers/errors-sentry/v0.1.1, providers/ldap/v0.2.14, providers/secrets-aws/v0.1.10, providers/storage-azure/v0.1.10, providers/storage-gcs/v0.1.10, providers/storage-s3/v0.1.10 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "b2a3e040"                                # = v1.20.1 exacto (contiene agent/v0.16.1, datasource/v1.1.0, proto/v0.8.1, quarkbridge/v1.9.6, quarkdatasource/v1.13.1, server/v0.21.1, ui/v1.2.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.42.0 publica la primera mitad de M0 de A12, el 2.0 anunciado
  donde se lee: nucleus trae sus nueve avisos de deprecación (DEP-2026-003
  fechado y 019…026) con asistentes de migración, trece marcas Deprecated y
  las salidas en 1.x (WithErrorEnvelope(), router.Wrap, Topic.String); orbit
  estrena su registro docs/deprecations/ con DEP-2026-001 (la identidad del
  nodo atada al certificado por defecto en el 2.0) y DEP-2026-002 (el
  adaptador datasource/nucleus se retira), la salida
  AllowSharedAgentCertificate, el adaptador marcado y un aviso al arrancar
  sobre el camino por defecto, el LIKE de quarkdatasource escapado en los
  seis motores, el panel leyendo problem+json y router.Wrap en sus dos
  llamadas (M0-O completa). Se mueven nucleus (v1.32.0 → v1.33.0) y orbit
  (v1.19.3 → v1.20.1); quark v1.17.0 sigue donde estaba. Módulos hermanos
  que cambian: nucleus auth-saml (v0.1.0 → v0.1.1), nucleus errors-sentry
  (v0.1.0 → v0.1.1), nucleus ldap (v0.2.13 → v0.2.14), nucleus mssql (v0.1.9
  → v0.1.10), nucleus mysql (v0.1.9 → v0.1.10), nucleus nucleus (v1.32.0 →
  v1.33.0), nucleus oracle (v0.1.9 → v0.1.10), nucleus otlp (v0.1.9 →
  v0.1.10), nucleus postgres (v0.1.9 → v0.1.10), nucleus prometheus (v0.1.9
  → v0.1.10), nucleus secrets-aws (v0.1.9 → v0.1.10), nucleus sqlite (v0.1.9
  → v0.2.0), nucleus storage-azure (v0.1.9 → v0.1.10), nucleus storage-gcs
  (v0.1.9 → v0.1.10), nucleus storage-s3 (v0.1.9 → v0.1.10), orbit agent
  (v0.15.3 → v0.16.1), orbit datasource (v1.0.1 → v1.1.0), orbit quarkbridge
  (v1.9.5 → v1.9.6), orbit quarkdatasource (v1.12.4 → v1.13.1), orbit server
  (v0.20.4 → v0.21.1) y orbit ui (v1.1.1 → v1.2.0); el resto sin cambio.
  Quark no se mueve porque desde v1.17.0 sólo lleva documentación (los siete
  avisos de M0-Q) y release-please no abre release por docs: esas siete
  filas del §3.0 del contrato del 2.0 siguen en main. Minor de suite porque
  lo es la de nucleus y orbit (QADR-0002). Corte de la semana de cadencia
  del lunes 19 adelantado al domingo 18 a petición del propietario; la lane
  semanal del lunes lo vigila igual.

  Qué cambia para quien instala. Nada se retira ni cambia de valor por
  defecto en este set: los avisos anuncian y las salidas se entregan. En
  nucleus: WithErrorEnvelope() fija el sobre de errores como forma explícita
  (hoy es el defecto; en el 2.0 lo será problem+json), router.Wrap(w)
  sustituye a NewWrapResponseWriter(w, protoMajor), Topic.String() lee el
  nombre de un topic sin el tipo Signal; pkg/model, la puerta sin tipo de
  signals y NewWrapResponseWriter llevan marca y staticcheck las señala; un
  fichero de políticas de 3 columnas, que casbin v2.135.0 ya rechazaba al
  cargar, falla ahora nombrando authz.MigrateCSVPolicyFile. En orbit: un
  admin-server con --agent-client-ca y sin --agent-identity-from-cert ni el
  nuevo --allow-shared-agent-certificate avisa una vez al arrancar de que el
  2.0 ata la identidad por defecto (las dos banderas a la vez rehúsan el
  arranque); una aplicación que monta el panel sin orbit.Config.DataSource,
  y un nodo del fleet con registro y sin DataSource, avisan al arrancar de
  que el adaptador se va en el 2.0; sobre quark en SQLite y Oracle, un % o _
  en un filtro o en la caja de búsqueda ya se contesta (antes se rechazaba
  con 400 o ensanchaba la búsqueda) y en los otros motores nada cambia; el
  panel lee problem+json además del sobre; la raíz, agent, server,
  quarkbridge y quarkdatasource requieren nucleus v1.33.0, y datasource
  sigue en v1.30.1 (su suelo desde que es módulo propio).

  Qué aprendió el tren. Un pilar cuyo main sólo lleva docs: desde su tag no
  corta, y no hay que subirle los suelos: el fix(deps) cortaría sus módulos
  por delante de la raíz, que el manifest-guard §3b rechaza; la fase quark
  del driver lo haría sola, así que se saltó. El driver no para para las
  notas de una minor de nucleus ni de orbit, y en orbit encadena orbit-
  align-notes.sh, que escribe una sección de alineación sobre una minor
  real: nucleus con --solo-suelos, notas y snapshot en la rama del bot y la
  fase después; orbit con la alineación a mano (orbit#570, con M0-O (b)
  dentro), notas y snapshot en la rama regenerada y la fase después.
  align_set.sh y manifest-guard §5 tienen la lista fija de seis módulos y no
  ven datasource ni ui. Y ui, datasource y quarkbridge salieron con la raíz:
  segundo corte de orbit (v1.20.1) a mano para re-pinar ui y datasource en
  raíz, agent, server y quarkdatasource, con su sección reescrita (la
  plantilla de alineación hablaba de nucleus y de un pin a la raíz que ya no
  existe).
