# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "0.2.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-06
status: certified           # segundo set certificado (0.2.0): tags reales + CI de integración en verde

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración (repo orbit): quarkbridge v0.1.0 y
# quarkdatasource v0.1.0 — también taggeados y resolubles standalone.
modules:
  quark:   "v1.1.5"
  nucleus: "v0.10.0"
  orbit:   "v0.3.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Orbit queda EN SU TAG. Nucleus va tres commits de
# housekeeping por delante de v0.10.0 (repin del showcase a tags, redirector
# de Pages, y la pata fleet opcional del showcase — todo examples/ci; el
# módulo del framework es idéntico a v0.10.0).
workspace_pins:
  quark:   "v1.1.5"                                  # = tag
  nucleus: "v0.10.1-0.20260706155336-1d2adac84d9c"    # = v0.10.0 + housekeeping de examples/ci
  orbit:   "v0.3.0"                                  # = tag

notes: >
  Quantum 0.2.0 — segundo set certificado: orbit v0.3.0 (rediseño completo de
  la UI del admin server según el handoff de diseño, dos temas, y métricas de
  host end-to-end Heartbeat→UI), nucleus v0.10.0 y quark v1.1.5. La pata fleet
  opcional del showcase (build tag) conecta la app demo como nodo del admin
  server. CI de integración compilando los nueve módulos del go.work.
