# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.40.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-10-06
status: certified           # Minor de suite por la minor de quark y orbit (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.16.0"
  nucleus: "v1.31.0"
  orbit:   "v1.19.1"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.8"
  mysql:         "v0.1.8"
  oracle:        "v0.1.8"
  postgres:      "v0.1.8"
  sqlite:        "v0.1.8"
  otlp:          "v0.1.8"
  prometheus:    "v0.1.8"
  ldap:          "v0.2.12"
  secrets-aws:   "v0.1.8"
  storage-azure: "v0.1.8"
  storage-gcs:   "v0.1.8"
  storage-s3:    "v0.1.8"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.2.0"
  mssql:    "v0.2.5"
  mysql:    "v0.2.5"
  oracle:   "v0.2.5"
  postgres: "v0.2.5"
  sqlite:   "v0.2.5"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  agent:           "v0.15.1"
  datasource:      "v1.0.0"
  proto:           "v0.8.0"
  quarkbridge:     "v1.9.4"
  quarkdatasource: "v1.12.2"
  server:          "v0.20.2"
  ui:              "v1.1.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "f064469c"                                # = v1.16.0 exacto (contiene cmd/quark/v1.2.0, drivers/mssql/v0.2.5, drivers/mysql/v0.2.5, drivers/oracle/v0.2.5, drivers/postgres/v0.2.5, drivers/sqlite/v0.2.5 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "81aceb55"                                # = v1.31.0 exacto (contiene drivers/mssql/v0.1.8, drivers/mysql/v0.1.8, drivers/oracle/v0.1.8, drivers/postgres/v0.1.8, drivers/sqlite/v0.1.8, exporters/otlp/v0.1.8, exporters/prometheus/v0.1.8, providers/ldap/v0.2.12, providers/secrets-aws/v0.1.8, providers/storage-azure/v0.1.8, providers/storage-gcs/v0.1.8, providers/storage-s3/v0.1.8 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "dc923330"                                # = v1.19.1 exacto (contiene agent/v0.15.1, datasource/v1.0.0, proto/v0.8.0, quarkbridge/v1.9.4, quarkdatasource/v1.12.2, server/v0.20.2, ui/v1.1.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.40.0 publica tres defectos de quark que cruzaban tenants bajo
  RowLevelSecurityClient —dos de ellos P0— y la mayor parte del arco A11
  (extensibilidad y catálogo) en quark y en el panel. Se mueven quark
  (v1.15.2 → v1.16.0, minor) y orbit (v1.18.1 → v1.19.1: la minor v1.19.0 y
  un patch que la completa); nucleus v1.31.0 sigue donde estaba. Módulos
  hermanos que cambian: los seis de quark (CLI v1.2.0, drivers v0.2.5) y
  cuatro de orbit (ui v1.1.0, server v0.20.2, quarkbridge v1.9.4,
  quarkdatasource v1.12.2). Minor de suite porque lo son las de quark y orbit
  (QADR-0002). Corte FUERA de la cadencia semanal (QADR-0008), un día después
  de 1.39.0: los arreglos de tenants no esperan a la semana.

  Qué cambia para quien instala. Quien use un router de tenants con
  RowLevelSecurityClient debe subir a quark v1.16.0: Find(id) leía la fila de
  otro tenant (QK-42), la rama de actualización de Upsert y UpsertBatch
  escribía en la fila de otro tenant que tuviera la clave en conflicto
  (QK-43), UpdateMap podía mover una fila de tenant (QK-44), las escrituras
  por clave ignoraban el Where del llamador (QK-40) y un grupo Or escapaba de
  los ámbitos de tenant y de borrado lógico (QK-41). Las escrituras que las
  condiciones excluyen devuelven ahora (0, nil) sin hooks ni auditoría. En
  quark, además y por adición: el contrato del dialecto vive en quarkdriver
  con alias en quark, el camino de esquema pregunta al dialecto por
  interfaces en vez de leer su nombre, integraciones con chi, Echo, Gin,
  gRPC y Nucleus probadas en CI, `quark init --with` que genera ese mismo
  código, y un banco de rendimiento sobre PostgreSQL y MySQL reales. En el
  panel, también por adición: acciones que piden datos con un formulario
  validado en el servidor, acciones sobre un registro que responden con una
  redirección dentro del panel o una descarga confinada, widgets de serie
  alimentados desde Go y varios dashboards cada uno con su permiso, tema y
  paleta por configuración aplicados antes del primer frame, y el código de
  cliente de la aplicación con sus renderers de campo bajo la CSP del panel.
  Lo único que se niega ahora a arrancar es una configuración que nunca tuvo
  efecto: un field_widgets que nombra un widget o un campo inexistente.

  Qué aprendió el tren. Un módulo que sube en el mismo corte que la raíz que
  lo requiere deja a la raíz con la versión vieja: orbit v1.19.0 cortó ui
  v1.1.0 con la raíz aún en ui v1.0.0, y hizo falta v1.19.1 para que las
  pantallas nuevas llegaran a quien instala; el set pina la segunda. El
  banco de rendimiento de quark —workflow no requerido— tumbó dos veces el
  release al tocarle un modelo de CPU nuevo con asignaciones idénticas; se
  fusionó con el gate obligatorio en verde y quark main ya ata los tiempos
  al modelo (QK-47). La minor de quark necesita su snapshot de docs y el
  tren no lo corta; el guard de voz de quark rechaza ids de ADR en las notas
  publicadas; y el tren escribió para orbit v1.19.0 notas de «alineación sin
  cambios» que había que reescribir. El go.work del paraguas gana
  quark/internal/integrations, el primer módulo de fixtures de quark.
