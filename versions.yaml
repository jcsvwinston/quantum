# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.28.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-05
status: certified           # Minor de suite por las minors de quark y nucleus (QADR-0002): el arco A1 (auditoría de madurez 2026-09-03) publicado en los tres pilares; corte en cadencia (QADR-0008)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.11.0"
  nucleus: "v1.24.0"
  orbit:   "v1.9.2"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.2"
  mysql:         "v0.1.2"
  oracle:        "v0.1.2"
  postgres:      "v0.1.2"
  sqlite:        "v0.1.2"
  otlp:          "v0.1.2"
  prometheus:    "v0.1.2"
  ldap:          "v0.2.6"
  secrets-aws:   "v0.1.2"
  storage-azure: "v0.1.2"
  storage-gcs:   "v0.1.2"
  storage-s3:    "v0.1.2"

# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  mssql:    "v0.1.2"
  mysql:    "v0.1.2"
  oracle:   "v0.1.2"
  postgres: "v0.1.2"
  sqlite:   "v0.1.2"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.4"
  agent:           "v0.6.16"
  server:          "v0.11.2"
  quarkbridge:     "v1.8.20"
  quarkdatasource: "v1.8.21"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "9d3dcb86"                                # = v1.11.0 exacto (contiene drivers/mssql/v0.1.2, drivers/mysql/v0.1.2, drivers/oracle/v0.1.2, drivers/postgres/v0.1.2, drivers/sqlite/v0.1.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "7075e9ac"                                # = v1.24.0 exacto (contiene drivers/mssql/v0.1.2, drivers/mysql/v0.1.2, drivers/oracle/v0.1.2, drivers/postgres/v0.1.2, drivers/sqlite/v0.1.2, exporters/otlp/v0.1.2, exporters/prometheus/v0.1.2, providers/ldap/v0.2.6, providers/secrets-aws/v0.1.2, providers/storage-azure/v0.1.2, providers/storage-gcs/v0.1.2, providers/storage-s3/v0.1.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "2744ac68"                                # = v1.9.2 exacto (contiene agent/v0.6.16, proto/v0.4.4, quarkbridge/v1.8.20, quarkdatasource/v1.8.21, server/v0.11.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.28.0 — la minor que publica el arco A1: la deuda de la
  auditoría de madurez del 3 de septiembre pagada en los tres pilares.
  quark v1.10.1 → v1.11.0 (drivers/* v0.1.2), nucleus v1.23.2 → v1.24.0
  (once módulos en v0.1.2 y providers/ldap v0.2.6) y orbit v1.9.0 →
  v1.9.2 (agent v0.6.16, server v0.11.2, quarkbridge v1.8.20,
  quarkdatasource v1.8.21, proto v0.4.4): v1.9.1 publica A1 y v1.9.2 es
  la alineación de pines a nucleus v1.24.0 y quark v1.11.0, sin cambio
  de producto. Minor de suite porque lo son las de quark y nucleus
  (QADR-0002); corte en la cadencia semanal (QADR-0008).

  Lo que cierra A1, por pilar. Nucleus (27 hallazgos): el timeout de
  petición es clave propia (request_timeout, con timeout_exempt_paths
  para SSE y descargas largas), el límite de tasa cuenta por usuario y
  tenant y no por IP, los datos flash viven exactamente una petición, los
  tokens se comprueban contra el emisor (y jwt_audience si se fija), un
  módulo generado abre solo lecturas al anónimo; CORS viaja en toda
  respuesta que sale de la pila, un subárbol montado contesta en su ruta
  sin barra en vez de redirigir, dos módulos con la misma ruta son un
  error que nombra al módulo, las migraciones toman el candado de sesión
  del motor, y ADR-032 fija dónde está la línea del major (mover código
  a un módulo con error guiado NO lo es). Quark (QK-6, QK-8): el migrador
  toma el candado de esquema por defecto y admite migraciones
  transaccionales (UpTx/DownTx), y el contrato del listener es público
  (quarkdriver.ListenerFactory sobre IdentifierValidator). Orbit (14
  hallazgos): en el fleet, tope de streams por operador, replay acotado,
  push agregado coalescido, un solo matcher de nodos, LIKE escapado por
  motor, reconexiones reales, CPU normalizada y comandos del agente bajo
  semáforo; en el panel, ids como string de punta a punta (ADR-001),
  tenant obligatorio en cada operación de Data Studio con 403 cuando no
  resuelve, 400 a una búsqueda sin campos buscables, auditoría de cada
  ruta mutante con valores antes y después (login incluido) y con lo
  que un anónimo puede escribir acotado, lookup del admin en una
  consulta acotada, y la SPA carga sus páginas bajo demanda (JS inicial
  1.693 → 308 kB). Suite (QM-18, QM-19): títulos de PR en inglés con
  guard en los tres repos, y los suelos de los módulos hermanos suben
  como PRIMER commit de cada corte (align-module-floors en el tren).

  Lo que se difiere a propósito: QK-14 (el go.mod raíz de quark requiere
  los cinco drivers porque el CLI enlaza todos los motores) va a A3 con
  la explicación en el README de quark; la mitad nucleus de OR-43
  (CRUD.FindAll responde 400 sin campos buscables, nucleus#476) y el
  paso 2 de QK-8 (drivers/postgres adopta ListenerFactory, quark#352)
  están fusionados en main y salen en la siguiente release de cada uno.

  Lo que cambia para quien instala: en nucleus, cuatro claves nuevas con
  default (request_timeout, timeout_exempt_paths, jwt_audience,
  session_memcached_servers), el limitador de tasa cambia de clave y un
  prefijo montado sin barra ya no redirige; en quark, Migrator.Up/Down
  toman el candado del motor (WithoutLock lo desactiva) y el migrador
  informa por Client.Logger() en vez de stdout; en orbit, un operador
  sin tenant resuelto recibe 403 en el panel multi-tenant y los ids del
  API de Data Studio son strings.
