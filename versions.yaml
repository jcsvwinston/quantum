# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.24.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-30
status: certified           # Deuda del arco QCD saldada y medida: release-please etiqueta las minor solo y con binarios (verificado en vivo), el re-pin del showcase deja de bloquear PRs, dos fugas reales (caché por tenant en quark, browse de storage en orbit) cerradas con el test movido a la puerta real, y los snapshots que mentían corregidos

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.7.1"
  nucleus: "v1.21.0"
  orbit:   "v1.8.13"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  ldap: "v0.2.3"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.6.8"
  server:          "v0.10.8"
  quarkbridge:     "v0.4.8"
  quarkdatasource: "v0.2.17"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "2cfd7d65"                                # = v1.7.1 exacto
  nucleus: "1ad05921"                                # = v1.21.0 exacto (y = providers/ldap/v0.2.3: los dos tags se cortaron en el MISMO commit, que es lo que permite certificar el módulo — ver manifest-guard §3b)
  orbit:   "54401c94"                                # = v1.8.13 exacto (contiene server/v0.10.8, agent/v0.6.8, proto/v0.4.2, quarkbridge/v0.4.8, quarkdatasource/v0.2.17 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.24.0 — la deuda que dejó el arco de anomalías QCD, saldada y
  medida (quark v1.7.1; nucleus v1.21.0 con providers/ldap v0.2.3; orbit
  v1.8.13 con agent v0.6.8, server v0.10.8, quarkbridge v0.4.8,
  quarkdatasource v0.2.17). Nada de esto son los catorce hallazgos de aquel
  arco —ya cerrados en 1.23.0—; es lo que se observó mientras se arreglaban.
  La regla del arco se mantuvo: medir antes de creer, y dos de las premisas
  del encargo resultaron falsas al ejecutarlas.

  §1 RELEASE-PLEASE YA ETIQUETA LAS MINOR DE NUCLEUS SIN INTERVENCIÓN, Y LAS
  RELEASES TRAEN BINARIOS. Las minor v1.18.0, v1.19.0 y v1.20.0 se habían
  fusionado con CI en verde y sin cortar el tag, y el diagnóstico de la ronda
  —que la culpa era del árbol de docs versionadas que sólo las minor
  añaden— era una correlación, no la causa. Medido: falla todo release PR de
  SOLO-ROOT, porque su rama compartida no lleva componente y la vía standalone
  del etiquetador lo compara contra la ruta del módulo y se rinde; las patch
  que funcionaron llevaban el módulo ldap de acompañante. La cura es cortar
  los release PR por componente. El mismo arreglo destapó que TODAS las
  releases auto-etiquetadas de la historia salían con cero binarios —los tags
  del token del bot no disparan el workflow de assets—, encadenado ahora
  explícitamente. Ambas cosas verificadas EN VIVO al cortar este set: v1.21.0
  etiquetó sola y salió con sus siete assets.

  §2 EL RE-PIN DEL EJEMPLO YA NO ENROJECE TODOS LOS PRS A LA VEZ. El guard de
  pins del showcase era de igualdad estricta, así que cualquier tag de un
  hermano ponía en rojo cada PR abierto de nucleus —la ronda anterior necesitó
  seis re-pins de emergencia—. Ahora tolera un minor de retraso con aviso, y
  un escritor y un workflow cierran el retraso solos. El recordatorio sigue
  existiendo (el aviso y el reloj de un minor); lo que desaparece es el bloqueo
  de PRs ajenos.

  §3 EL BORDE QUARKDATASOURCE→ROOT DE ORBIT VUELVE A ESTAR AL DÍA. Pinaba el
  root diez parches por detrás dentro del mismo minor: tolerado hoy, pero un
  minor del root lo habría sacado de rango en plena certificación. Subido antes
  de que pudra.

  §4 DOS DEFECTOS REALES DESTAPADOS BARRIENDO LOS TESTS QUE ENTRAN POR LA
  PUERTA EQUIVOCADA. En quark, bajo RLS nativo la clave de la caché L2 no
  llevaba el tenant, así que dos tenants con la misma consulta compartían clave
  y el resultado cacheado de uno se servía al otro: el motor protegía la base
  de datos, nada protegía la caché. En orbit, el navegador de ficheros del
  panel no confinaba la ruta al directorio de subidas cuando había un backend
  de almacenamiento configurado —la rama de producción—, así que una sesión con
  permiso de lectura podía enumerar cualquier prefijo del bucket. Ambos con
  rojo reproducido antes del arreglo; ambos con el test movido a la puerta real.

  Y los cabos sueltos del arco: el modo de autorización abierta de nucleus
  ahora sí decodifica el bearer (apagaba la autorización y de paso la
  autenticación, dejando ciegos a interceptores y handlers); la vía documentada
  para montar las rutas federadas tiene por fin un ejemplo ejecutable, que
  destapó tres desajustes de la prosa; y los snapshots de documentación que
  anunciaban una versión anterior —en nucleus y en orbit, visibles en el sitio
  publicado— quedaron corregidos y con guardas que cazan también la forma que
  se colaba sin marcador.
