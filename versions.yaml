  dos bugs
  de telemetría fleet y UX incipiente. **Plano fleet (server v0.7.0 +
  agent v0.5.0, orbit#66)**: el filtro agregado se reanuda al reconectar
  un agente (State.OnAgentSubMode estaba sin cablear → pérdida silenciosa
