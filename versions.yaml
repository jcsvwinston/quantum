# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.0.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-11
status: certified           # EL HITO DE CONVERGENCIA: los tres pilares en major 1

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración y pata fleet (repo orbit), también en tag y
# resolubles standalone: quarkbridge v0.2.0, quarkdatasource v0.2.0,
# proto v0.1.0, agent v0.2.0, server v0.2.0 (binario admin-server instalable
# con `go install`).
modules:
  quark:   "v1.1.5"
  nucleus: "v1.0.0"
  orbit:   "v1.0.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. El RC de orbit v1.0.0 pasó la validación de lockstep A-7
# (quantum#41) antes del tag del major.
workspace_pins:
  quark:   "v1.1.5"                                  # = tag
  nucleus: "a5fc3565"                                # = v1.0.0 + snapshot de docs 1.0.0 y housekeeping del CLI (código de la librería idéntico al tag; el sitio ensambla las docs versionadas desde este pin)
  orbit:   "v1.0.0"                                  # = tag (PRIMER MAJOR)

notes: >
  Quantum 1.0.0 — EL HITO DE CONVERGENCIA (QADR-0005 cumplido): quark v1.1.5,
  nucleus v1.0.0 y orbit v1.0.0 — los tres pilares en major 1. El gate de
  orbit quedó íntegro: contrato datasource congelado con guard de freeze
  (100 símbolos), pata fleet resoluble por tags (verificado desde módulo
  scratch y go install), Config con promesa v1.0 en godoc, barrido
  anti-falsedad de todas las superficies de docs, 2 waivers §B aprobados
  (W1 RPCs RBAC/audit y W2 row count → v1.1), y el RC validado por el lane
  A-7. Desde este set rige el régimen de majors en lockstep (QADR-0002):
  las subversiones de cada módulo flotan entre releases Quantum; los majors
  solo se cruzan en una release Quantum coordinada.
