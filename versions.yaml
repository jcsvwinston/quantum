# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.39.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-10-05
status: certified           # Minor de suite por la minor de nucleus (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.15.2"
  nucleus: "v1.31.0"
  orbit:   "v1.18.1"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.8"
  mysql:         "v0.1.8"
  oracle:        "v0.1.8"
  postgres:      "v0.1.8"
  sqlite:        "v0.1.8"
  otlp:          "v0.1.8"
  prometheus:    "v0.1.8"
  ldap:          "v0.2.12"
  secrets-aws:   "v0.1.8"
  storage-azure: "v0.1.8"
  storage-gcs:   "v0.1.8"
  storage-s3:    "v0.1.8"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.1.2"
  mssql:    "v0.2.4"
  mysql:    "v0.2.4"
  oracle:   "v0.2.4"
  postgres: "v0.2.4"
  sqlite:   "v0.2.4"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  agent:           "v0.15.1"
  datasource:      "v1.0.0"
  proto:           "v0.8.0"
  quarkbridge:     "v1.9.3"
  quarkdatasource: "v1.12.1"
  server:          "v0.20.1"
  ui:              "v1.0.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "d32e9cdb"                                # = v1.15.2 exacto (contiene cmd/quark/v1.1.2, drivers/mssql/v0.2.4, drivers/mysql/v0.2.4, drivers/oracle/v0.2.4, drivers/postgres/v0.2.4, drivers/sqlite/v0.2.4 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "81aceb55"                                # = v1.31.0 exacto (contiene drivers/mssql/v0.1.8, drivers/mysql/v0.1.8, drivers/oracle/v0.1.8, drivers/postgres/v0.1.8, drivers/sqlite/v0.1.8, exporters/otlp/v0.1.8, exporters/prometheus/v0.1.8, providers/ldap/v0.2.12, providers/secrets-aws/v0.1.8, providers/storage-azure/v0.1.8, providers/storage-gcs/v0.1.8, providers/storage-s3/v0.1.8 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "b153d93e"                                # = v1.18.1 exacto (contiene agent/v0.15.1, datasource/v1.0.0, proto/v0.8.0, quarkbridge/v1.9.3, quarkdatasource/v1.12.1, server/v0.20.1, ui/v1.0.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.39.0 cierra el arco A10 (Testing y OpenAPI de primera clase) y
  publica el arreglo de un defecto de quark que borraba las filas
  equivocadas. El banco del API de nucleus mide 46 de 46, y el starter de
  suite publica su documento OpenAPI y lo consume un cliente TypeScript
  generado, en una lane obligatoria del CI de nucleus. Se mueven nucleus
  (v1.30.1 → v1.31.0, minor) y quark (v1.15.0 → v1.15.2, dos patches: la
  primera sólo sube los suelos de sus módulos; la segunda trae QK-39); orbit
  v1.18.0 → v1.18.1, un patch que sólo alinea sus pines con quark v1.15.2 y
  nucleus v1.31.0. Módulos hermanos que cambian: los doce de nucleus (drivers y
  exportadores v0.1.8, providers/ldap v0.2.12, los cuatro de nube v0.1.8),
  los seis de quark (CLI v1.1.2, drivers v0.2.4)
  y cuatro de orbit por la misma alineación (agent v0.15.1, quarkbridge
  v1.9.3, quarkdatasource v1.12.1, server v0.20.1). Minor de suite
  porque lo es la de nucleus (QADR-0002). Corte por cierre de arco.

  Qué cambia para quien instala. En quark, la corrección de QK-39 (P0):
  desde la primera release, DeleteBy, UpdateMap y UpdateFields pintaban su
  propio WHERE sin mirar la lógica de cada condición, así que
  WhereNot("status", "=", "active").DeleteBy() borraba justo las filas
  activas que excluía; los grupos Or se unían con AND, e IN y BETWEEN
  fallaban. Las escrituras pasan ahora por el mismo renderizador que List, y
  un test comprueba en los seis motores que cada escritura toca exactamente
  las filas que List devuelve con las mismas condiciones. Quien llamara a
  esos tres métodos después de WhereNot debe revisar los datos que tocaron.
  La referencia de quark además decía que Update(entity) respetaba el Where
  de la consulta como guarda, y nunca lo hizo: ahora lo dice (QK-40 lo
  arreglará en A11). En nucleus, todo por adición; las formas que se retiran
  en el major 2.0 llevan su aviso de deprecación con fecha (DEP-2026-009,
  -011 y -012). Un kit de test que arranca la aplicación entera y la recorre
  por HTTP (cliente con sesión, datos, dobles de mail, storage, colas y HTTP
  saliente, CheckModule para módulos). Un documento OpenAPI que se deriva de
  las rutas, de los structs y de la seguridad que la aplicación aplica
  (WithOpenAPIDocument), que la aplicación puede exigir a sus peticiones
  (WithOpenAPIValidation) y el test a sus respuestas (AssertConforms), y que
  `nucleus openapi --check` compara con una línea base para cazar rupturas.
  Endpoints tipados (nucleus.Handle) que dan sus tipos al documento; binding
  tipado de query, path y cabeceras; problem+json junto al sobre de error,
  incluido el 404 del propio router; Provide/Resolve y DependsOn entre
  módulos; y un generador de cliente TypeScript propio, en Go y sin
  dependencias (`nucleus openapi --client typescript`).

  Qué aprendió el tren. El defecto de quark apareció con el tren ya en
  marcha y v1.15.1 recién etiquetada: se dejó avanzar nucleus, se cortó
  quark otra vez y orbit se alineó una sola vez, en vez de certificar un set
  con el defecto y cortar otro detrás. Fusionar los suelos de nucleus
  regeneró la rama del release y se llevó las notas y el snapshot escritos a
  mano en ella, como ya avisaba el README del tren: guardarlos como parches
  antes de lanzar la fase cuesta un minuto y ahorra reescribirlos. Y la
  integración de A10 vio lo que ningún PR suelto veía: seis sesiones
  fusionadas como PRs apilados dejaron cinco costuras entre ellas, cazadas
  montando la pila en local antes de fusionar. El guard 54,
  umbrella-api-posture, entra con este set porque sólo al pin nuevo hay
  banco del API que vigilar.
