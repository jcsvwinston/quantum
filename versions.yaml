# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.33.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-18
status: certified           # Minor de suite por la minor de nucleus y orbit (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.14.0"
  nucleus: "v1.29.0"
  orbit:   "v1.10.1"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.5"
  mysql:         "v0.1.5"
  oracle:        "v0.1.5"
  postgres:      "v0.1.5"
  sqlite:        "v0.1.5"
  otlp:          "v0.1.5"
  prometheus:    "v0.1.5"
  ldap:          "v0.2.9"
  secrets-aws:   "v0.1.5"
  storage-azure: "v0.1.5"
  storage-gcs:   "v0.1.5"
  storage-s3:    "v0.1.5"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.0.1"
  mssql:    "v0.2.1"
  mysql:    "v0.2.1"
  oracle:   "v0.2.1"
  postgres: "v0.2.1"
  sqlite:   "v0.2.1"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.4"
  agent:           "v0.7.0"
  server:          "v0.12.0"
  quarkbridge:     "v1.9.0"
  quarkdatasource: "v1.9.1"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "1d13cf24"                                # = v1.14.0 exacto (contiene cmd/quark/v1.0.1, drivers/mssql/v0.2.1, drivers/mysql/v0.2.1, drivers/oracle/v0.2.1, drivers/postgres/v0.2.1, drivers/sqlite/v0.2.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "6e2a05e0"                                # = v1.29.0 exacto (contiene drivers/mssql/v0.1.5, drivers/mysql/v0.1.5, drivers/oracle/v0.1.5, drivers/postgres/v0.1.5, drivers/sqlite/v0.1.5, exporters/otlp/v0.1.5, exporters/prometheus/v0.1.5, providers/ldap/v0.2.9, providers/secrets-aws/v0.1.5, providers/storage-azure/v0.1.5, providers/storage-gcs/v0.1.5, providers/storage-s3/v0.1.5 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "87c1f294"                                # = v1.10.1 exacto (contiene agent/v0.7.0, proto/v0.4.4, quarkbridge/v1.9.0, quarkdatasource/v1.9.1, server/v0.12.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.33.0 publica el arco A6: Orbit deja de ser un panel de
  observabilidad con un CRUD genérico encima y pasa a ser el admin del
  producto. Se mueven nucleus (v1.28.0 → v1.29.0) y orbit (v1.9.6 →
  v1.10.1); quark v1.14.0 sigue donde estaba. Módulos hermanos que cambian:
  orbit agent (v0.6.20 → v0.7.0), orbit quarkbridge (v1.8.24 → v1.9.0),
  orbit quarkdatasource (v1.8.25 → v1.9.1) y orbit server (v0.11.6 →
  v0.12.0); el resto sin cambio. Minor de suite porque lo son las de nucleus
  y orbit (QADR-0002). Corte fuera de la cadencia semanal por la razón que
  QADR-0008 admite: cierra un arco.

  Lo que cambia para quien instala. Un operador podía mirarlo todo y
  administrar a nadie: no había ruta que creara una cuenta, le cambiara la
  contraseña o la desactivara, los permisos se paraban en el borde del
  modelo, y el rastro de auditoría se iba con el proceso. Ahora las cuentas
  se crean, se gradúan y se revocan desde el panel; una política puede
  nombrar un campo (admin:Post.title) o confinarse a las filas propias
  (admin:Post#own), y lo que una pantalla carga lleva las capacidades del
  operador, así que la interfaz apaga lo que no puede hacer en vez de
  descubrirlo con un 403; el rastro vive en una tabla con ventana de
  retención, exportación y el historial de un registro. Un formulario
  resuelve una relación, edita los hijos y acepta un fichero. Una lista
  admite doce operadores —rango, subcadena, conjunto, nulo— con un total que
  un paginador puede dividir, y el conjunto de filtros se guarda. Una fila de
  sesión dice de quién es y desde qué dispositivo, y una llamada cierra todas
  las de una cuenta sin cerrar la propia. Las vistas de operación informan de
  lo que PASA y no de cómo están configuradas: la caché que el panel enseña y
  vacía es la que la aplicación declara, el correo enseña entrega, las
  migraciones degradan con el motivo, y /api/* contesta 404 JSON en vez de
  una página web. Y la aplicación puede añadir lo suyo: sus verbos sobre sus
  modelos, sus pantallas dentro del panel, su marca (logo, color, favicon),
  las tarjetas de su resumen y el idioma del cromo. Todo por adición: ninguna
  configuración, política o llamada que funcionara contra 1.32.0 se comporta
  distinto. La release v1.10.1 de orbit añade los filtros con operador sobre
  un origen de datos de Quark, que su módulo no podía escribir hasta que la
  raíz publicara el contrato.

  Lo que aprendió el tren. Un release PR cuya rama no se regenera —porque el
  commit que falta es un test(...), que release-please no considera
  publicable— habría cortado el tag SIN el instrumento de navegador dentro:
  gh pr update-branch la pone al día y, de paso, dispara el CI que esa rama
  no dispara nunca. Un fix que pertenece sólo a un módulo hermano saca su tag
  DESPUÉS del de la raíz, y entonces el módulo queda por delante del set sin
  forma de certificarlo: la salida documentada —un cambio del paquete raíz
  más Release-As en el mismo tren— tuvo que usarse, y por eso hay dos
  releases de orbit en esta ronda. Y la deuda de documentación de una minor
  se paga EN la rama del release: release-please sube el marcador de versión
  de la doc, pero la sección de las notas la escribe una persona, y el guard
  de coherencia de orbit es el que lo recuerda.
