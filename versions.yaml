# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.2.1"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-12
status: certified           # patch de quark (auditoría CLI/docs/guard); nucleus y orbit sin cambios

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración y pata fleet (repo orbit), en tag y resolubles
# standalone: quarkbridge v0.3.0, quarkdatasource v0.2.1, proto v0.3.0,
# agent v0.4.0, server v0.5.0 (binario admin-server instalable con go install).
modules:
  quark:   "v1.2.1"
  nucleus: "v1.1.0"
  orbit:   "v1.2.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG (el de quark EXACTO en el tag,
# sin matiz de docs: el snapshot 1.2.0 del sitio ya viene dentro).
workspace_pins:
  quark:   "8ff89a1f"                                # = v1.2.1 exacto
  nucleus: "956a782b"                                # = v1.1.0 + housekeeping CLI + barrido de docs (status v1.x en current y snapshot 1.0.0; librería idéntica al tag)
  orbit:   "abf802a"                                 # = v1.2.0 + barrido de docs W1/W2 (código idéntico al tag)

notes: >
  Quantum 1.2.1 — patch de quark: la auditoría post-1.2.0 (12 hallazgos
  H-Q1..H-Q12, brief de la 7ª sesión) curada en quark v1.2.1 sin tocar la
  superficie de query-builder/CRUD. Lo gordo: la CLI funciona de fábrica
  (quark init escribía un driver que sql.Open no reconocía; oracle ni
  estaba enlazado), los comandos que fallan salen con exit != 0, sync ya no
  anuncia flags que ignoraba, Quote() auto-escapa el carácter de cierre
  (defensa en profundidad) y el guard de raw queries deja de rechazar `--`
  dentro de literales. Además: govulncheck y un check de coherencia de
  versión en el CI de quark (la forcing function que faltó al taggear
  v1.2.0 — estrenada en este mismo release). govulncheck del set completo
  (8 módulos, BD 2026-07-12): 0 vulnerabilidades alcanzables. Nucleus
  v1.1.0 y Orbit v1.2.0 continúan del set 1.2.0 (sin cambios; sus notas en
  el release Quantum 1.2.0).
