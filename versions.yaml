# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.32.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-12
status: certified           # Minor de suite por la minor de nucleus (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.14.0"
  nucleus: "v1.28.0"
  orbit:   "v1.9.6"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.5"
  mysql:         "v0.1.5"
  oracle:        "v0.1.5"
  postgres:      "v0.1.5"
  sqlite:        "v0.1.5"
  otlp:          "v0.1.5"
  prometheus:    "v0.1.5"
  ldap:          "v0.2.9"
  secrets-aws:   "v0.1.5"
  storage-azure: "v0.1.5"
  storage-gcs:   "v0.1.5"
  storage-s3:    "v0.1.5"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.0.1"
  mssql:    "v0.2.1"
  mysql:    "v0.2.1"
  oracle:   "v0.2.1"
  postgres: "v0.2.1"
  sqlite:   "v0.2.1"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.4"
  agent:           "v0.6.20"
  server:          "v0.11.6"
  quarkbridge:     "v1.8.24"
  quarkdatasource: "v1.8.25"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "1d13cf24"                                # = v1.14.0 exacto (contiene cmd/quark/v1.0.1, drivers/mssql/v0.2.1, drivers/mysql/v0.2.1, drivers/oracle/v0.2.1, drivers/postgres/v0.2.1, drivers/sqlite/v0.2.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "bf453678"                                # = v1.28.0 exacto (contiene drivers/mssql/v0.1.5, drivers/mysql/v0.1.5, drivers/oracle/v0.1.5, drivers/postgres/v0.1.5, drivers/sqlite/v0.1.5, exporters/otlp/v0.1.5, exporters/prometheus/v0.1.5, providers/ldap/v0.2.9, providers/secrets-aws/v0.1.5, providers/storage-azure/v0.1.5, providers/storage-gcs/v0.1.5, providers/storage-s3/v0.1.5 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "a82b64d0"                                # = v1.9.6 exacto (contiene agent/v0.6.20, proto/v0.4.4, quarkbridge/v1.8.24, quarkdatasource/v1.8.25, server/v0.11.6 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.32.0 publica el arco A5: la autenticación de nucleus deja de ser
  un sustrato sobre el que construir y pasa a ser algo que una aplicación
  monta. Se mueven nucleus (v1.27.0 → v1.28.0) y orbit (v1.9.5 → v1.9.6, una
  release de alineación sin cambio de producto); quark v1.14.0 sigue donde
  estaba. Módulos hermanos que cambian: orbit agent (v0.6.19 → v0.6.20),
  quarkbridge (v1.8.23 → v1.8.24), quarkdatasource (v1.8.24 → v1.8.25) y
  server (v0.11.5 → v0.11.6); el resto sin cambio. Minor de suite porque lo
  es la de nucleus (QADR-0002). Corte fuera de la cadencia semanal por la
  razón que QADR-0008 admite: cierra un arco.

  Lo que cambia para quien instala. Nucleus tenía sesiones, tokens, hash de
  contraseñas, motor de políticas y dos costuras de extensión, y ninguna ruta
  que iniciara sesión a nadie: cada aplicación escribía los mismos siete
  manejadores y volvía a decidir cuánto vive un enlace de reset, si puede
  usarse dos veces y qué revela un login fallido. Ahora hay tres módulos
  opt-in que lo traen decidido. `pkg/accounts` sirve registro con
  verificación, login, logout, reset, cambio de contraseña, enlace mágico y
  bloqueo progresivo; `pkg/auth/apikeys` emite la credencial que usa un
  programa —mostrada una vez, revocable, con scopes, rotación con periodo de
  gracia y CLI—; y `pkg/auth/federated/oidc` llena la costura federada que
  estaba escrita y vacía desde v1.15.0, con PKCE siempre, discovery, JWKS y
  un id_token verificado contra audiencia, emisor, expiración y nonce. El
  segundo factor es TOTP con códigos de recuperación y reautenticación para
  las operaciones sensibles; los secretos se cifran en reposo y sin clave el
  enrolamiento se rechaza, en vez de guardarlos en claro. Una identidad lleva
  ya una LISTA de roles —un proveedor que devuelve tres grupos tenía un solo
  campo donde ponerlos—, las sesiones ajenas se pueden revocar y un token
  emitido también, y la política decide sobre un OBJETO y no sólo sobre una
  ruta, así que «puede editar los posts que son suyos» deja de reimplementarse
  dentro de cada manejador. El correo transaccional gana HTML, adjuntos,
  plantillas y encolado dentro de la transacción del llamante.
  Nada se retira y ninguna firma se mueve: una aplicación que no monta nada
  se comporta igual que antes.

  Lo que corrige, y conviene leer si usas MySQL. El store SQL de cuentas no
  podía abrir una base MySQL: emitía `CREATE INDEX IF NOT EXISTS`, que ese
  motor no tiene. Salió a la luz en la primera corrida de la prueba que el
  propio arco añadió contra motores reales, y no antes, porque las pruebas
  unitarias corren sobre SQLite, donde la sentencia es válida. Es el mismo
  patrón que A4 dejó escrito: lo que no se ejecuta contra el motor no está
  medido.

  Y una postura que ahora se puede comprobar. `contracts/baseline/asvs_l2.txt`
  mapea el framework sobre OWASP ASVS 4.0.3 nivel 2 —27 requisitos, cada uno
  con una prueba que falla cuando el control deja de cumplirse: 24 cumplidos,
  2 que completa la aplicación y 1 que no se cumple, con su razón—. Un
  documento de postura que no puede decir que no es una página de marketing.

  Lo que aprendió el tren. La imagen de MinIO dejó de servirse en Docker Hub,
  así que la lane de storage y con ella el gate obligatorio salían rojos en
  cualquier PR por algo ajeno al cambio: ahora se tira de quay.io. Y fusionar
  el primero de una pila de PRs borrando su rama CIERRA automáticamente los
  que la tenían por base, y un PR cerrado no se puede reabrir ni reapuntar —
  la pila entera se reapunta a main ANTES de fusionar el primero.
