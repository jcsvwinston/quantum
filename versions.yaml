# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.18.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-26
status: certified           # Arco A del plan de extensibilidad: los subsistemas que eligen backend dejan de hacerlo con un switch cerrado (almacenamiento, store de sesión) y nace la costura de backends de autenticación. Minor de nucleus, minor de suite (QADR-0002)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.6.1"
  nucleus: "v1.13.0"
  orbit:   "v1.7.4"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.5.17"
  server:          "v0.9.13"
  quarkbridge:     "v0.3.16"
  quarkdatasource: "v0.2.13"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "7fa5eb80"                                # = v1.6.1 exacto
  nucleus: "3570e085"                                # = v1.13.0 exacto
  orbit:   "cf94c479"                                # = v1.7.4 exacto (contiene server/v0.9.13, agent/v0.5.17, proto/v0.4.2, quarkbridge/v0.3.16, quarkdatasource/v0.2.13 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.18.0 — Arco A del plan de extensibilidad (nucleus v1.13.0). El
  problema que cierra: de seis subsistemas que eligen backend, exactamente
  UNO era extensible desde fuera —el correo—; los demás lo elegían con un
  switch sobre constantes, así que quien corre Ceph, Swift, un almacén
  interno o un directorio corporativo no tenía más camino que forkear el
  framework. Eso es lo que impide que nazca un ecosistema, y es la ventana
  que conviene cerrar ANTES del lanzamiento, porque después cada contrato
  cuesta una major con ventana de deprecación. §1 el almacenamiento se
  registra por nombre (storage.RegisterProvider), y todo lo que el framework
  pone encima —breaker, prefijo por tenant, mapeador de URL pública— se
  aplica alrededor de lo que devuelva la factoría, así que un proveedor no
  reimplementa nada. Había TRES puertas cerradas y no una: construcción,
  validación de config y el paraguas de pkg/app. §2 el store de sesión
  igual, con hook de apagado opcional para el que sostiene un pool. §3 la
  costura de autenticación: auth.RegisterBackend más una CADENA ORDENADA,
  que es lo que permite «el directorio primero, una cuenta local después» —
  cuando el directorio no responde, alguien tiene que poder entrar a
  arreglarlo. Tres resultados y no dos: aceptación, rechazo cierto y NO
  DISPONIBLE; si todos rechazaron el llamante recibe credenciales
  inválidas, y si alguno no respondía recibe un error que lo dice, porque
  «contraseña mala» y «el directorio está caído» mandan al operador a
  sitios muy distintos. Un error inesperado cuenta como no disponible: un
  backend fallando de forma imprevista no puede dejar a todo el mundo
  fuera. Dos cosas las cazaron los propios guards durante el arco: el
  firewall de dependencias vio que el registro de sesión devolvía el tipo de
  la librería interna, lo que habría obligado a cada autor de plugins a
  depender de ella (ahora hay interfaz propia con tipos de stdlib y un
  adaptador dentro), y el paraguas de storage caía a «local» por defecto,
  así que un nombre mal escrito escribía las subidas al disco EN SILENCIO —
  misma clase que los once hallazgos del set anterior. quark v1.6.1 y orbit
  v1.7.4 sin cambios de comportamiento; orbit solo se alinea. El historial
  narrativo completo vive en CHANGELOG.md.
