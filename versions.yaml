# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.13.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-19
status: certified           # Arcos QCD-FW-4..11 (re-verificación de la demo externa): capa SSR utilizable por la vía documentada, outbox sin ventana de arranque ni owner compartido, config estricta sin claves anunciadas-pero-rechazadas; minor de nucleus (v1.8.0→v1.9.1) fuerza el minor de suite (QADR-0002)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.5.0"
  nucleus: "v1.9.1"
  orbit:   "v1.6.2"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.5.12"
  server:          "v0.9.7"
  quarkbridge:     "v0.3.11"
  quarkdatasource: "v0.2.10"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "372afa40"                                # = v1.5.0 exacto
  nucleus: "1ff498ad"                                # = v1.9.1 exacto
  orbit:   "37783bd2"                                # = v1.6.2 exacto (contiene server/v0.9.7, agent/v0.5.12, proto/v0.4.2, quarkbridge/v0.3.11, quarkdatasource/v0.2.10 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.13.0 — Arcos QCD-FW-4..11 (la re-verificación continua de la demo
  externa sobre la serie v1.8.x/v1.9.x de nucleus; quark v1.5.0 y el resto del
  set continúan del 1.12.0). nucleus v1.9.1 acumula: FW-4
  create_bucket_if_missing alcanzable desde nucleus.yml + paridad de espejos
  de config por reflexión; FW-5 knobs de outbox (missing_route_policy,
  lease_owner por instancia); FW-6 Flush sin pánico; FW-7 plantillas
  recursivas con nombre por ruta relativa y scaffold renderizable; FW-8
  newChild como única derivación de sub-routers (los módulos con Prefix
  reciben motor y sesión — y el session manager por fin cableado al árbol);
  FW-9 WithTemplateFuncs/WithTemplates; FW-10 el dispatcher del outbox
  arranca tras las extensiones; FW-11 el builder re-expone toda app.Option
  con guard de paridad app↔builder, y el baseline de API congelado exige
  regenerarse ante adiciones. Suites nuevas en CI: conformidad SSR de 5
  puntos y scaffold ejecutable. orbit v1.6.2: alineación de deps a nucleus
  v1.9.1 (agent v0.5.12, server v0.9.7, quarkbridge v0.3.11; proto y
  quarkdatasource sin cambios). Nombre 1.13.0 (minor): el minor de nucleus
  arrastra el número de suite (QADR-0002). El historial narrativo completo
  vive en CHANGELOG.md.
