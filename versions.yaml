# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.44.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-11-12
status: certified           # Corte fuera de cadencia (QADR-0008; razón: el propietario pidió adelantar al 2026-11-11 el set de la semana de cadencia del 16, con los dos módulos nuevos de nucleus y Go 1.26.11 por GO-2026-6859 ya en main; orbit cerró el 12). Minor de suite por la minor de quark y nucleus (QADR-0002)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.19.0"
  nucleus: "v1.35.0"
  orbit:   "v1.21.3"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
# La entrada `nucleus` de este bloque es el CLI (`cmd/nucleus`), módulo propio
# desde nucleus v1.32.0 (ADR-038 de nucleus) que va en LOCKSTEP con la raíz: no
# es paquete de release-please, release.yml le corta `cmd/nucleus/vX.Y.Z` en el
# commit de cada `vX.Y.Z`, y bump-set la escribe desde ese tag.
nucleus_modules:
  nucleus:       "v1.35.0"
  mssql:         "v0.1.12"
  mysql:         "v0.1.12"
  oracle:        "v0.1.12"
  postgres:      "v0.1.12"
  sqlite:        "v0.2.2"
  otlp:          "v0.1.12"
  prometheus:    "v0.1.12"
  quarkmake:     "v0.1.0"
  auth-saml:     "v0.1.3"
  errors-sentry: "v0.1.3"
  ldap:          "v0.2.16"
  secrets-aws:   "v0.1.12"
  storage-azure: "v0.1.12"
  storage-gcs:   "v0.1.12"
  storage-s3:    "v0.1.12"
  tasks-asynq:   "v0.1.0"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.3.0"
  mssql:    "v0.3.2"
  mysql:    "v0.3.2"
  oracle:   "v0.3.2"
  postgres: "v0.3.2"
  sqlite:   "v0.3.2"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  agent:           "v0.16.5"
  datasource:      "v1.1.2"
  proto:           "v0.8.3"
  quarkbridge:     "v1.9.8"
  quarkdatasource: "v1.13.5"
  server:          "v0.22.3"
  ui:              "v1.2.2"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "06a210a3"                                # = v1.19.0 exacto (contiene cmd/quark/v1.3.0, drivers/mssql/v0.3.2, drivers/mysql/v0.3.2, drivers/oracle/v0.3.2, drivers/postgres/v0.3.2, drivers/sqlite/v0.3.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "4703e546"                                # = v1.35.0 exacto (contiene drivers/mssql/v0.1.12, drivers/mysql/v0.1.12, drivers/oracle/v0.1.12, drivers/postgres/v0.1.12, drivers/sqlite/v0.2.2, exporters/otlp/v0.1.12, exporters/prometheus/v0.1.12, pkg/nucleustest/quarkmake/v0.1.0, providers/auth-saml/v0.1.3, providers/errors-sentry/v0.1.3, providers/ldap/v0.2.16, providers/secrets-aws/v0.1.12, providers/storage-azure/v0.1.12, providers/storage-gcs/v0.1.12, providers/storage-s3/v0.1.12, providers/tasks-asynq/v0.1.0 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "db2789b2"                                # = v1.21.3 exacto (contiene agent/v0.16.5, datasource/v1.1.2, proto/v0.8.3, quarkbridge/v1.9.8, quarkdatasource/v1.13.5, server/v0.22.3, ui/v1.2.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.44.0 publica la DX al 5 de A12 en nucleus y quark, y dos
  módulos nuevos de nucleus: en nucleus, los generadores escriben modelos
  Quark y endpoints tipados que el documento OpenAPI describe, nucleus new
  --with orbit monta el panel con una fuente de datos, doctor/health/config
  print aceptan la configuración de los proveedores que el proyecto
  importa, y nacen pkg/nucleustest/quarkmake (la factoría con la que
  nucleustest.Make persiste modelos Quark, D12) y providers/tasks-asynq (la
  ruta del proveedor de jobs en el 2.0, ya instalable, DEP-2026-020); en
  quark, los 30 centinelas Err* dicen qué hacer, la CLI emite el DDL como
  JSON (--emit json, el primer consumidor es nucleus), el sitio estrena un
  playground de consultas en WebAssembly (D13), tres guías de producción y
  el arreglo de QK-100; orbit sólo alinea pines y toolchain. Go 1.26.11 en
  los tres (GO-2026-6859). Se mueven
  quark (v1.18.0 → v1.19.0), nucleus (v1.34.0 → v1.35.0) y orbit (v1.21.1 →
  v1.21.3). Módulos hermanos que cambian: quark mssql (v0.3.1 → v0.3.2),
  quark mysql (v0.3.1 → v0.3.2), quark oracle (v0.3.1 → v0.3.2), quark
  postgres (v0.3.1 → v0.3.2), quark quark (v1.2.2 → v1.3.0), quark sqlite
  (v0.3.1 → v0.3.2), nucleus auth-saml (v0.1.2 → v0.1.3), nucleus errors-
  sentry (v0.1.2 → v0.1.3), nucleus ldap (v0.2.15 → v0.2.16), nucleus mssql
  (v0.1.11 → v0.1.12), nucleus mysql (v0.1.11 → v0.1.12), nucleus nucleus
  (v1.34.0 → v1.35.0), nucleus oracle (v0.1.11 → v0.1.12), nucleus otlp
  (v0.1.11 → v0.1.12), nucleus postgres (v0.1.11 → v0.1.12), nucleus
  prometheus (v0.1.11 → v0.1.12), nucleus quarkmake (nuevo, v0.1.0), nucleus
  secrets-aws (v0.1.11 → v0.1.12), nucleus sqlite (v0.2.1 → v0.2.2), nucleus
  storage-azure (v0.1.11 → v0.1.12), nucleus storage-gcs (v0.1.11 →
  v0.1.12), nucleus storage-s3 (v0.1.11 → v0.1.12), nucleus tasks-asynq
  (nuevo, v0.1.0), orbit agent (v0.16.3 → v0.16.5), orbit datasource (v1.1.1
  → v1.1.2), orbit proto (v0.8.2 → v0.8.3), orbit quarkbridge (v1.9.7 →
  v1.9.8), orbit quarkdatasource (v1.13.3 → v1.13.5), orbit server (v0.22.1
  → v0.22.3) y orbit ui (v1.2.1 → v1.2.2); el resto sin cambio. Minor de
  suite porque lo es la de quark y nucleus (QADR-0002). Corte fuera de
  cadencia: el propietario pidió adelantar al martes 11 el set de la
  semana de cadencia del lunes 16 (orbit cerró el 12); la lane semanal del
  lunes lo vigila igual.

  Qué cambia para quien instala. Nada se retira, ningún valor por defecto
  cambia y ninguna firma exportada se mueve. En quark: el texto de los
  centinelas que se devuelven a pelo (ErrNotFound, ErrTimeout,
  ErrConstraintViolation, los de listener y lock, ErrNoRegisteredModels)
  crece con la pista tras dos puntos —errors.Is sigue igual; un test que
  compare err.Error() con el texto exacto se entera—; migrate create
  --from-models carga el paquete de modelos dentro de su propio módulo
  (QK-100), con lo que una ruta absoluta funciona desde cualquier
  directorio; cmd/quark sale como v1.3.0. En nucleus: generate model,
  generate resource y startapp escriben modelos Quark y repositorios sobre
  quark.For[T] (ningún fichero generado importa pkg/model); generate
  module escribe cinco endpoints nucleus.Handle con 201/204 y errores por
  el sobre o problem+json; nucleus new --with orbit implica quark y
  quarkdatasource; doctor, health y config print leen los imports en
  blanco de main.go y aceptan las claves de cada proveedor enlazado;
  nucleustest.Make persiste un struct no registrado a través de la
  factoría instalada (quarkmake) y sin factoría falla con la receta; el
  proveedor asynq sigue enlazado por el framework, así que el import de
  providers/tasks-asynq es opcional hasta el 2.0. En orbit: la raíz,
  agent, server, quarkbridge y quarkdatasource requieren nucleus v1.35.0 y
  quark v1.19.0; nada en los binarios ni en el panel cambia. Los binarios
  y la imagen de los tres se construyen con Go 1.26.11; la directiva go no
  se mueve.

  Qué aprendió el tren. Tercera vulnerabilidad de la biblioteca estándar
  de Go el día del corte (GO-2026-6859): PR de toolchain por repo antes de
  los suelos. release-please proponía los dos módulos nuevos de nucleus
  como v1.9.2 (la versión que heredan de la raíz): release-as 0.1.0 por
  paquete en el PR de suelos y un chore que lo quita tras el corte
  (nucleus#652, #655). La regeneración de la rama del bot de quark se
  llevó el esqueleto de notas: quark-doc-debt.sh otra vez tras su run.
  Orbit flakeó tres veces en el banco admin (EXT-04, EXT-10 y dos tests de
  la UI) y un gate se quedó una hora en cola con el run cerrado: relanzar
  el run entero; registrado como OR-149 con la causa probable (el puerto
  que tryStart reserva y suelta). Y segundo corte de orbit (v1.21.3) por
  cuarta vez seguida.
