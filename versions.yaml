# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.45.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-11-16
status: certified           # Corte fuera de cadencia (QADR-0008; razón: el propietario pidió seguir avanzando el 13 y el set adelanta la cadencia del lunes 23 para publicar D9-N y D10-O, precondición de M1; quark cortó el 14, nucleus el 15 y orbit el 16). Minor de suite por la minor de nucleus y orbit (QADR-0002)

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.19.1"
  nucleus: "v1.36.0"
  orbit:   "v1.22.0"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
# La entrada `nucleus` de este bloque es el CLI (`cmd/nucleus`), módulo propio
# desde nucleus v1.32.0 (ADR-038 de nucleus) que va en LOCKSTEP con la raíz: no
# es paquete de release-please, release.yml le corta `cmd/nucleus/vX.Y.Z` en el
# commit de cada `vX.Y.Z`, y bump-set la escribe desde ese tag.
nucleus_modules:
  nucleus:       "v1.36.0"
  mssql:         "v0.1.13"
  mysql:         "v0.1.13"
  oracle:        "v0.1.13"
  postgres:      "v0.1.13"
  sqlite:        "v0.2.3"
  otlp:          "v0.1.13"
  prometheus:    "v0.1.13"
  quarkmake:     "v0.1.1"
  auth-saml:     "v0.1.4"
  errors-sentry: "v0.1.4"
  ldap:          "v0.2.17"
  secrets-aws:   "v0.1.13"
  storage-azure: "v0.1.13"
  storage-gcs:   "v0.1.13"
  storage-s3:    "v0.1.13"
  tasks-asynq:   "v0.1.1"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.3.1"
  mssql:    "v0.3.3"
  mysql:    "v0.3.3"
  oracle:   "v0.3.3"
  postgres: "v0.3.3"
  sqlite:   "v0.3.3"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  agent:           "v0.16.6"
  datasource:      "v1.1.2"
  proto:           "v0.8.3"
  quarkbridge:     "v1.9.9"
  quarkdatasource: "v1.14.0"
  server:          "v0.22.4"
  ui:              "v1.2.2"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "e5b439d4"                                # = v1.19.1 exacto (contiene cmd/quark/v1.3.1, drivers/mssql/v0.3.3, drivers/mysql/v0.3.3, drivers/oracle/v0.3.3, drivers/postgres/v0.3.3, drivers/sqlite/v0.3.3 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "3d64c8ad"                                # = v1.36.0 exacto (contiene drivers/mssql/v0.1.13, drivers/mysql/v0.1.13, drivers/oracle/v0.1.13, drivers/postgres/v0.1.13, drivers/sqlite/v0.2.3, exporters/otlp/v0.1.13, exporters/prometheus/v0.1.13, pkg/nucleustest/quarkmake/v0.1.1, providers/auth-saml/v0.1.4, providers/errors-sentry/v0.1.4, providers/ldap/v0.2.17, providers/secrets-aws/v0.1.13, providers/storage-azure/v0.1.13, providers/storage-gcs/v0.1.13, providers/storage-s3/v0.1.13, providers/tasks-asynq/v0.1.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "a4b6413b"                                # = v1.22.0 exacto (contiene agent/v0.16.6, datasource/v1.1.2, proto/v0.8.3, quarkbridge/v1.9.9, quarkdatasource/v1.14.0, server/v0.22.4, ui/v1.2.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.45.0 publica las dos sesiones de 1.x de las decisiones D9 y D10 del
  contrato del 2.0, precondición de M1: en nucleus, generate module lee el root
  de composición y, sobre WithoutDefaults() sin WithAuthz() (el starter api),
  escribe las filas de política comentadas con la pista, lo dice (policy: NONE,
  DEP-2026-017) y el test generado arranca como main.go y afirma el 201 anónimo
  (D9, NU-127); el lector de doctor lee todos los ficheros del paquete main y
  mira bajo cmd/; makemigrations deriva el par de migraciones de los modelos
  Quark del proyecto a través del CLI de quark (DX-N3n2) y en una segunda
  pasada sólo rinde lo nuevo (NU-170); en orbit, quarkdatasource.Register toma
  opciones tipadas que declaran lo que Data Studio lista, busca, filtra y
  esconde, con exclusión por defecto de las columnas que parecen credenciales
  (D10), y un campo excluido sale de todas las filas que el panel contesta, no
  sólo del esquema (OR-150, DS-18: 73 de 73); en quark, migrate create --from-
  models rinde el DDL idempotente de cada motor (QK-101). Go 1.26.11 en los
  tres, sin mover. Se mueven quark (v1.19.0 → v1.19.1), nucleus (v1.35.0 →
  v1.36.0) y orbit (v1.21.3 → v1.22.0). Módulos hermanos que cambian: quark
  mssql (v0.3.2 → v0.3.3), quark mysql (v0.3.2 → v0.3.3), quark oracle (v0.3.2
  → v0.3.3), quark postgres (v0.3.2 → v0.3.3), quark quark (v1.3.0 → v1.3.1),
  quark sqlite (v0.3.2 → v0.3.3), nucleus auth-saml (v0.1.3 → v0.1.4), nucleus
  errors- sentry (v0.1.3 → v0.1.4), nucleus ldap (v0.2.16 → v0.2.17), nucleus
  mssql (v0.1.12 → v0.1.13), nucleus mysql (v0.1.12 → v0.1.13), nucleus nucleus
  (v1.35.0 → v1.36.0), nucleus oracle (v0.1.12 → v0.1.13), nucleus otlp
  (v0.1.12 → v0.1.13), nucleus postgres (v0.1.12 → v0.1.13), nucleus prometheus
  (v0.1.12 → v0.1.13), nucleus quarkmake (v0.1.0 → v0.1.1), nucleus secrets-aws
  (v0.1.12 → v0.1.13), nucleus sqlite (v0.2.2 → v0.2.3), nucleus storage-azure
  (v0.1.12 → v0.1.13), nucleus storage-gcs (v0.1.12 → v0.1.13), nucleus
  storage-s3 (v0.1.12 → v0.1.13), nucleus tasks-asynq (v0.1.0 → v0.1.1), orbit
  agent (v0.16.5 → v0.16.6), orbit quarkbridge (v1.9.8 → v1.9.9), orbit
  quarkdatasource (v1.13.5 → v1.14.0) y orbit server (v0.22.3 → v0.22.4); el
  resto sin cambio. Minor de suite porque lo es la de nucleus y orbit
  (QADR-0002). Corte fuera de cadencia: el propietario pidió seguir avanzando
  el viernes 13 y el set adelanta la cadencia del lunes 23 para publicar lo que
  M1 espera; la lane semanal del lunes lo vigila igual.

  Qué cambia para quien instala. Nada se retira, ningún valor por defecto
  cambia y ninguna firma exportada se mueve. En nucleus: una rebanada generada
  por un CLI anterior sobre el starter api conserva sus filas como código y el
  arranque sigue diciendo lo que descarta; regenerarla las escribe comentadas;
  makemigrations sobre un proyecto con internal/models necesita cmd/quark
  v1.3.0 o posterior en el PATH, o deja que go run lo traiga. En orbit: un
  modelo registrado sin opciones se ve como antes salvo por las columnas cuyo
  nombre parece credencial, que quedan ocultas hasta que el modelo diga
  ShowSensitive, y por un campo excluido, que ya no viaja en las filas; la
  raíz, agent, server, quarkbridge y quarkdatasource requieren nucleus v1.36.0,
  y quarkbridge y quarkdatasource quark v1.19.1. En quark: el par que la CLI
  rinde para SQL Server, Oracle y MySQL se aplica tal cual; el contrato schema
  1 de --emit json no cambia.

  Qué aprendió el tren. Es el primero que publica el propietario desde su
  terminal (el clasificador de permisos de la sesión deniega las fases que
  publican; la sesión preparó suelos, notas, snapshots y alineación y paró
  antes de cada corte), y el primero desde un locale UTF-8: bash 3.2 leía los
  bytes de «» pegados a una variable como parte de su nombre y el tren dio por
  anclada una rama que no lo estaba (quantum#317). El corte de quark v1.19.1
  puso en rojo el release PR de nucleus: su lane suite-starter construye la CLI
  de quark al último tag y el test de makemigrations esperaba el DDL de Oracle
  en minúsculas, que QK-101 acaba de pasar a mayúsculas (nucleus#667, el test,
  no el producto). Un require de una línea, la forma en que go mod tidy escribe
  el único require directo de un módulo, era invisible para el script de suelos
  y para manifest-guard: providers/tasks-asynq llevaba dos minors de retraso
  sin aviso (nucleus#668 sube el suelo; quantum#318, que se fusiona después del
  set, arregla los tres lectores y amplía la fixture del guard). Las notas de
  nucleus escritas antes del tren llevaban la fecha del día en que se
  escribieron y se re-fecharon antes de fusionar (nucleus#669); orbit alineó
  pines por orbit#599, escribió sus notas en la rama del bot y cortó sin
  segundo corte. El preflight corre govulncheck con la toolchain declarada
  (quantum#316). Detalle en la sección 1.45.0 de scripts/train/README.md.
