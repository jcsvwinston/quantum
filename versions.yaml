# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.43.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-11-07
status: certified           # Minor de suite por la minor de quark, nucleus y orbit (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.18.0"
  nucleus: "v1.34.0"
  orbit:   "v1.21.1"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
# La entrada `nucleus` de este bloque es el CLI (`cmd/nucleus`), módulo propio
# desde nucleus v1.32.0 (ADR-038 de nucleus) que va en LOCKSTEP con la raíz: no
# es paquete de release-please, release.yml le corta `cmd/nucleus/vX.Y.Z` en el
# commit de cada `vX.Y.Z`, y bump-set la escribe desde ese tag.
nucleus_modules:
  nucleus:       "v1.34.0"
  mssql:         "v0.1.11"
  mysql:         "v0.1.11"
  oracle:        "v0.1.11"
  postgres:      "v0.1.11"
  sqlite:        "v0.2.1"
  otlp:          "v0.1.11"
  prometheus:    "v0.1.11"
  auth-saml:     "v0.1.2"
  errors-sentry: "v0.1.2"
  ldap:          "v0.2.15"
  secrets-aws:   "v0.1.11"
  storage-azure: "v0.1.11"
  storage-gcs:   "v0.1.11"
  storage-s3:    "v0.1.11"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.2.2"
  mssql:    "v0.3.1"
  mysql:    "v0.3.1"
  oracle:   "v0.3.1"
  postgres: "v0.3.1"
  sqlite:   "v0.3.1"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  agent:           "v0.16.3"
  datasource:      "v1.1.1"
  proto:           "v0.8.2"
  quarkbridge:     "v1.9.7"
  quarkdatasource: "v1.13.3"
  server:          "v0.22.1"
  ui:              "v1.2.1"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "77e9b8a1"                                # = v1.18.0 exacto (contiene cmd/quark/v1.2.2, drivers/mssql/v0.3.1, drivers/mysql/v0.3.1, drivers/oracle/v0.3.1, drivers/postgres/v0.3.1, drivers/sqlite/v0.3.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "5dd2884c"                                # = v1.34.0 exacto (contiene drivers/mssql/v0.1.11, drivers/mysql/v0.1.11, drivers/oracle/v0.1.11, drivers/postgres/v0.1.11, drivers/sqlite/v0.2.1, exporters/otlp/v0.1.11, exporters/prometheus/v0.1.11, providers/auth-saml/v0.1.2, providers/errors-sentry/v0.1.2, providers/ldap/v0.2.15, providers/secrets-aws/v0.1.11, providers/storage-azure/v0.1.11, providers/storage-gcs/v0.1.11, providers/storage-s3/v0.1.11 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "1d6035fa"                                # = v1.21.1 exacto (contiene agent/v0.16.3, datasource/v1.1.1, proto/v0.8.2, quarkbridge/v1.9.7, quarkdatasource/v1.13.3, server/v0.22.1, ui/v1.2.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.43.0 publica la segunda mitad de M0 de A12 y lo que M0-R y
  M0-F dejaron en main: los once avisos del 2.0 que seguían sin set (los
  siete de quark, DEP-2026-004…010, y los cuatro de M0-R: DEP-2026-011 de
  quark y DEP-2026-003, 004 y 005 de orbit), con lo que las 34 filas del
  §3.0 del contrato del 2.0 están publicadas y el 2.0 no puede salir antes
  del 2027-02-07; los cuatro P1 de la re-auditoría arreglados en orbit
  (OR-78, OR-79, OR-80, OR-99); el registro de proveedores de pkg/tasks en
  nucleus; el token quark:"literal_column" y el fix de la columna clave
  por tramos en CreateBatch/UpsertBatch (QK-70) en quark; crewjam/saml
  v0.5.2 y Go 1.26.10 (GO-2026-6809) en los tres. Se mueven quark (v1.17.0
  → v1.18.0), nucleus (v1.33.0 → v1.34.0) y orbit (v1.20.1 → v1.21.1).
  Módulos hermanos que cambian: quark mssql (v0.3.0 → v0.3.1), quark mysql
  (v0.3.0 → v0.3.1), quark oracle (v0.3.0 → v0.3.1), quark postgres
  (v0.3.0 → v0.3.1), quark quark (v1.2.1 → v1.2.2), quark sqlite (v0.3.0 →
  v0.3.1), nucleus auth-saml (v0.1.1 → v0.1.2), nucleus errors-sentry
  (v0.1.1 → v0.1.2), nucleus ldap (v0.2.14 → v0.2.15), nucleus mssql
  (v0.1.10 → v0.1.11), nucleus mysql (v0.1.10 → v0.1.11), nucleus nucleus
  (v1.33.0 → v1.34.0), nucleus oracle (v0.1.10 → v0.1.11), nucleus otlp
  (v0.1.10 → v0.1.11), nucleus postgres (v0.1.10 → v0.1.11), nucleus
  prometheus (v0.1.10 → v0.1.11), nucleus secrets-aws (v0.1.10 → v0.1.11),
  nucleus sqlite (v0.2.0 → v0.2.1), nucleus storage-azure (v0.1.10 →
  v0.1.11), nucleus storage-gcs (v0.1.10 → v0.1.11), nucleus storage-s3
  (v0.1.10 → v0.1.11), orbit agent (v0.16.1 → v0.16.3), orbit datasource
  (v1.1.0 → v1.1.1), orbit proto (v0.8.1 → v0.8.2), orbit quarkbridge
  (v1.9.6 → v1.9.7), orbit quarkdatasource (v1.13.1 → v1.13.3), orbit
  server (v0.21.1 → v0.22.1) y orbit ui (v1.2.0 → v1.2.1); el resto sin
  cambio. Minor de suite porque lo es la de los tres pilares (QADR-0002).
  Corte de la semana de cadencia del lunes 9 adelantado al sábado 7 a
  petición del propietario; la lane semanal del lunes lo vigila igual.

  Qué cambia para quien instala. Nada se retira ni cambia de valor por
  defecto en este set: los avisos anuncian y las salidas se entregan. En
  quark: CreateBatch y UpsertBatch deciden la columna clave por tramo de
  entidades y no por la primera (una entidad con clave tras una sin ella
  ya no la pierde; una sin clave tras una con ella ya no inserta id=0);
  quark:"literal_column" mantiene sin aviso una columna que de verdad se
  llama como una directiva de pkg/model, y la auditoría de EnableAuditLog
  deja de avisar de su propia columna pk. En nucleus:
  tasks.RegisterProvider y LookupProvider resuelven jobs_provider por
  nombre, el proveedor asynq se registra solo y nucleus doctor --check
  tasks lo lista; hooks.SQLQueryEvent y SQLQueryObserver observan cada
  consulta; db.New y nucleustest.Transactional rehúsan un driver
  compartido entre clientes; la lane SAML tolera GO-2026-6909 sobre
  crewjam/saml v0.5.2 —arreglada upstream, sin versión arreglada en la
  base de datos de Go— con una excepción de un id, un módulo y una versión
  que caduca el 2026-12-31. En orbit: un operador puede quedar atado a un
  tenant (tenant_id en la cuenta y en la API de operadores) y, sin
  tenant_switch ni superusuario, una petición que resuelve otro tenant por
  el resolver se rechaza con 403 como ya se rechazaba por ?tenant=; el
  permiso system_env acompaña a system_pulse para leer el entorno; --peer-
  ca/--peer-cert/--peer-key y server.PeerTLSFromFiles forman el mesh de
  admin-server bajo mTLS; --peer-allowlist (opt-in) rechaza los peers que
  el servidor no marca; import, fixtures, exports y el widget de fichero
  bajo tenant usan la clave lógica del panel; Data Studio sobre
  quarkdatasource valida (422), clasifica (409, 404) y el panel comprueba
  el registro antes de llamar a la fuente; un fichero importado con su
  clave de sólo lectura ya no se rechaza y las celdas CSV llegan tipadas.
  La raíz, agent, server, quarkbridge y quarkdatasource de orbit requieren
  nucleus v1.34.0 y quark v1.18.0.

  Qué aprendió el tren. El paso «Tag The CLI Module» del release de
  nucleus murió por SIGPIPE (un awk con exit cerraba la tubería mientras
  base64 escribía, bajo pipefail): los activos se publicaron pero
  cmd/nucleus/v1.34.0 se cortó a mano en el commit del release tras
  comprobar su suelo, y nucleus#643 lee el go.mod entero. Las notas de
  nucleus iban fechadas al lunes de cadencia y se re-fecharon al día del
  corte (nucleus#642) antes de fusionar el release. Orbit volvió a
  necesitar segundo corte (v1.21.1): ui, datasource y proto salieron con
  la raíz y agent, server, quarkdatasource y la raíz los requerían un tag
  atrás. La receta de 1.42.0 —nucleus con --solo-suelos, orbit con la
  alineación en PR propio, notas y snapshot en la rama del bot y la fase
  después— volvió a funcionar; el guard de voz de producto rechaza «P1» en
  unas notas públicas.
