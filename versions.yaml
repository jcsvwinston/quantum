# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.17.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-08-25
status: certified           # Orbit versiona su documentación: era el único de los tres que servía siempre su doc actual. quark y nucleus sin cambios; el minor de orbit y la capacidad nueva para el lector dan el minor de suite

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.6.0"
  nucleus: "v1.12.0"
  orbit:   "v1.7.0"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.5.15"
  server:          "v0.9.11"
  quarkbridge:     "v0.3.14"
  quarkdatasource: "v0.2.12"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "fe270c32"                                # = v1.6.0 exacto
  nucleus: "8bc9088f"                                # = v1.12.0 exacto
  orbit:   "0a665268"                                # = v1.7.0 exacto (contiene server/v0.9.11, agent/v0.5.15, proto/v0.4.2, quarkbridge/v0.3.14, quarkdatasource/v0.2.12 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.17.0 — orbit v1.7.0 versiona su documentación, y con eso los TRES
  productos publican archivo por minor. Era el único que servía siempre su doc
  actual: quien corría orbit 1.2 leía la del set vigente sin que nada se lo
  dijera. El paraguas lo sabía —lo decía un comentario de su config— pero el
  lector no. NINGUNA ruta se mueve: lastVersion current mantiene la doc actual
  en /orbit/ y los snapshots aparecen aparte; el cambio es aditivo. El corte no
  usa `docusaurus docs:version` porque orbit no tiene instalación propia (su
  website/ es solo docs/ y el sitio lo ensambla el paraguas, QADR-0003): son
  tres operaciones de fichero, y como su sidebar es AUTOGENERADA desde la
  estructura de carpetas, la versionada es la misma declaración de una línea —
  añadir una página no obliga a tocar nada. HUECO HISTÓRICO DECLARADO: el
  archivo empieza en 1.6.7, la versión publicada al instalar el versionado; las
  minors 1.0-1.5 no tienen snapshot y NO se fabrican, porque un snapshot
  retroactivo afirmaría que la doc de hoy fue la de entonces — la mentira que
  este mecanismo existe para impedir. Registro de guards 21 → 22 con
  orbit-docs-archive y su fixture. Dos cosas las cazaron los guards durante el
  arco, ambas del propio cableado: el guard nº17 de enlaces vio que el «Edit
  this page» de los snapshots apuntaba a orbit_versioned_docs/, el prefijo de
  ENSAMBLADO del paraguas, que en el repo de orbit no existe (mismo replace que
  ya tenía quark); y el guard de frescura recién instalado mordió su primer
  caso real al exigir el snapshot de 1.7.0. Además se REVIRTIÓ un arreglo
  propio: hacer que la matriz de módulos leyera el manifiesto para cerrar su
  ventana rancia dejaba el PR de release en ROJO sin arreglo posible —empujar a
  una rama de release-please la deja sin CI—, así que se asume la ventana y
  queda escrito en el script POR QUÉ el arreglo obvio no vale. quark v1.6.0 y
  nucleus v1.12.0 sin cambios. El historial narrativo completo vive en
  CHANGELOG.md.
