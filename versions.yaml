# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.26.1"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-04
status: certified           # La auditoría de madurez 2026-09-03 aplicada: 4 P0 cerrados (Quark rechazaba lib/pq y mattn; Orbit no aplicaba TLS al fleet; el ejemplo canónico de Nucleus no arrancaba; docs con build tags), módulos hermanos que compilan solos en los tres repos, y una sola historia sobre D3

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.10.1"
  nucleus: "v1.23.1"
  orbit:   "v1.8.18"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.1"
  mysql:         "v0.1.1"
  oracle:        "v0.1.1"
  postgres:      "v0.1.1"
  sqlite:        "v0.1.1"
  otlp:          "v0.1.1"
  prometheus:    "v0.1.1"
  ldap:          "v0.2.5"
  secrets-aws:   "v0.1.1"
  storage-azure: "v0.1.1"
  storage-gcs:   "v0.1.1"
  storage-s3:    "v0.1.1"

# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  mssql:    "v0.1.1"
  mysql:    "v0.1.1"
  oracle:   "v0.1.1"
  postgres: "v0.1.1"
  sqlite:   "v0.1.1"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.3"
  agent:           "v0.6.11"
  server:          "v0.10.12"
  quarkbridge:     "v1.8.18"
  quarkdatasource: "v1.8.18"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "6d7d661e"                                # = v1.10.1 exacto (contiene drivers/mssql/v0.1.1, drivers/mysql/v0.1.1, drivers/oracle/v0.1.1, drivers/postgres/v0.1.1, drivers/sqlite/v0.1.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "d9d51a80"                                # = v1.23.1 exacto (contiene drivers/mssql/v0.1.1, drivers/mysql/v0.1.1, drivers/oracle/v0.1.1, drivers/postgres/v0.1.1, drivers/sqlite/v0.1.1, exporters/otlp/v0.1.1, exporters/prometheus/v0.1.1, providers/ldap/v0.2.5, providers/secrets-aws/v0.1.1, providers/storage-azure/v0.1.1, providers/storage-gcs/v0.1.1, providers/storage-s3/v0.1.1 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "2e00a592"                                # = v1.8.18 exacto (contiene agent/v0.6.11, proto/v0.4.3, quarkbridge/v1.8.18, quarkdatasource/v1.8.18, server/v0.10.12 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-intenotes: >
  Quantum 1.26.1 — el set que aplica la auditoría de madurez del
  2026-09-03 (quark v1.10.1 con drivers en v0.1.1; nucleus v1.23.1 con los
  doce módulos hermanos en v0.1.1 y providers/ldap v0.2.5; orbit v1.8.18
  con proto v0.4.3, agent v0.6.11, server v0.10.12, quarkbridge v1.8.18 y
  quarkdatasource v1.8.18). Patch en los tres pilares; la suite sube patch.

  La auditoría midió cada pilar contra los frameworks con los que un equipo
  compararía —GORM y ent; Gin, Buffalo, Encore, Django y Rails; Django
  Admin, Filament y Directus— y encontró 147 defectos con fichero y línea.
  Cuatro eran P0 y ninguno estaba en el runtime profundo: los cuatro
  esperaban al evaluador en su primera hora. Quark rechazaba desde v1.10.0
  los drivers registrados bajo alias (lib/pq, mattn/go-sqlite3): la
  comprobación solo buscaba el alias, así que pedía importar un módulo que
  ya estaba enlazado. Orbit nunca aplicaba el tls.Config a los listeners
  del fleet: los flags de certificado se aceptaban y se ignoraban, y
  configurarlos contaba como autenticación, así que un listener «con TLS»
  arrancaba en claro, sin token y en todas las interfaces; el mTLS que la
  doc anunciaba en ocho sitios no existía. El ejemplo canónico de Nucleus
  no importaba el módulo del driver y salía con exit 1. Y la documentación
  de entrada de Nucleus seguía diciendo «SQLite incluido» y «-tags mssql».

  Lo que cambia para quien instala: los módulos de driver publicados
  compilan solos (los de Quark requerían un core sin quarkdriver; los de
  Nucleus, uno sin pkg/db/driver), `nucleus add otlp|prometheus` existe y
  es lo que el arranque recomienda, el 500 genérico ya no filtra
  err.Error() salvo en desarrollo, Data Studio valida con las etiquetas del
  modelo y responde 422 por campo, el snapshot del sistema enmascara
  cualquier variable con URL, DSN o credencial, y la SPA del panel hace lo
  que dice: importa de verdad, «Load more» acumula, el JSON se edita como
  JSON y una política deny se ve como deny. Orbit gana --agent-client-ca y
  el agente habla https.

  El paraguas cuenta por fin UNA sola historia sobre D3: README, RUMBO, la
  página de instalación y el bloque require, go.work e integration.yml
  descubren los 26 módulos publicables del árbol; el tren clasifica
  cualquier release de módulo sin lista escrita; cuatro guards nuevos (32 en
  total) cazan claims retirados en la fuente de nucleus y en el HTML
  servido, un go.work que no cubra el manifiesto y un RUMBO que no diga el
  set vigente. El anuncio a
  quantum-app deja de ser fire-and-forget: espera el run y exige el PR, y
  documenta el permiso del repo que falta para que exista.

  Trampas del tren de este set, ya en el runbook: el push de la fusión de
  un release PR NO disparó «Release Please» en nucleus (hubo que lanzarlo a
  mano; el driver ahora lo detecta y lo dispara); quark tenía release-as
  pegajoso y PRs por módulo, como nucleus antes de D3, y pasa a un solo
  release PR; el driver no reconocía «chore: release main» y daba el merge
  por bueno sin esperar tag, ahora lee los tags del manifest; y el guard de
  voz de producto rechaza citar un ADR en las release notes. Los informes
  completos y el plan a 5/5 están enlazados en docs/RUMBO.md.
