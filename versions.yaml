# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "0.4.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-09
status: certified           # cuarto set certificado (0.4.0): la deuda de deprecación de nucleus pagada

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración (repo orbit): quarkbridge v0.1.0 y
# quarkdatasource v0.1.0 — también taggeados y resolubles standalone.
modules:
  quark:   "v1.1.5"
  nucleus: "v0.12.0"
  orbit:   "v0.3.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG. El RC de nucleus v0.12.0 pasó la
# validación de lockstep A-7 (quantum#37) antes del tag.
workspace_pins:
  quark:   "v1.1.5"                                  # = tag
  nucleus: "v0.12.0"                                 # = tag
  orbit:   "v0.3.0"                                  # = tag

notes: >
  Quantum 0.4.0 — cuarto set certificado: nucleus v0.12.0 (la deuda de
  deprecación pagada — borrados DEP-2026-004/005/006/008 y NewJSONTask, con
  rebaseline deliberado de -17 símbolos y -2 claves; el gate v1.0 queda con
  el §A resuelto al completo), orbit v0.3.0 y quark v1.1.5. Segundo RC
  validado por el lane de lockstep A-7 antes de taggear. Camino restante a
  Quantum 1.0: rama v1.0.0 de nucleus (flip de CORS + waivers §B + slice 9),
  después orbit a v1.0 en lockstep (QADR-0005) y la certificación 1.0.0.
