# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.35.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-20
status: certified           # Minor de suite por la minor de quark (QADR-0002); escrito por bump-set, revisar al certificar

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules»; los módulos hermanos de
# cada repo en «quark_modules», «nucleus_modules» y «orbit_modules» — todos
# machine-readable (DX-25): manifest-guard verifica TODOS los bloques contra
# los tags del pin (los hermanos los DESCUBRE del árbol), y
# scripts/print-requires.sh emite el bloque require pegable con la ruta de
# cada módulo resuelta del árbol. El pin del root de quarkdatasource lag ≤1
# minor topológicamente forzado, tolerado por el guard extendido, ceñido al
# único borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.15.0"
  nucleus: "v1.30.1"
  orbit:   "v1.10.3"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.7"
  mysql:         "v0.1.7"
  oracle:        "v0.1.7"
  postgres:      "v0.1.7"
  sqlite:        "v0.1.7"
  otlp:          "v0.1.7"
  prometheus:    "v0.1.7"
  ldap:          "v0.2.11"
  secrets-aws:   "v0.1.7"
  storage-azure: "v0.1.7"
  storage-gcs:   "v0.1.7"
  storage-s3:    "v0.1.7"

# La clave de cada módulo es el ÚLTIMO segmento de su ruta, que es como la
# deriva manifest-guard. Para `cmd/quark` eso da `quark`: la entrada `quark`
# de ESTE bloque es el CLI, no el pilar — el pilar es `modules.quark`, y son
# secciones distintas que nadie mezcla mecánicamente. Se deja dicho porque se
# lee mal. Resolverlo de raíz (clave = ruta completa) renombraría también las
# de drivers, providers y exporters: es un cambio aparte.
# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  quark:    "v1.1.0"
  mssql:    "v0.2.2"
  mysql:    "v0.2.2"
  oracle:   "v0.2.2"
  postgres: "v0.2.2"
  sqlite:   "v0.2.2"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.4"
  agent:           "v0.7.2"
  server:          "v0.12.2"
  quarkbridge:     "v1.9.2"
  quarkdatasource: "v1.9.3"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "2a0ef4c0"                                # = v1.15.0 exacto (contiene cmd/quark/v1.1.0, drivers/mssql/v0.2.2, drivers/mysql/v0.2.2, drivers/oracle/v0.2.2, drivers/postgres/v0.2.2, drivers/sqlite/v0.2.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  nucleus: "baaa6ce1"                                # = v1.30.1 exacto (contiene drivers/mssql/v0.1.7, drivers/mysql/v0.1.7, drivers/oracle/v0.1.7, drivers/postgres/v0.1.7, drivers/sqlite/v0.1.7, exporters/otlp/v0.1.7, exporters/prometheus/v0.1.7, providers/ldap/v0.2.11, providers/secrets-aws/v0.1.7, providers/storage-azure/v0.1.7, providers/storage-gcs/v0.1.7, providers/storage-s3/v0.1.7 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)
  orbit:   "1b215053"                                # = v1.10.3 exacto (contiene agent/v0.7.2, proto/v0.4.4, quarkbridge/v1.9.2, quarkdatasource/v1.9.3, server/v0.12.2 como ancestros — tags cortados en el MISMO commit o antes, que es lo que permite certificar cada módulo: manifest-guard §3/§3b lo verifica en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.35.0 publica el arco A8: Quark como capa de datos enterprise. Se
  mueven quark (v1.14.0 → v1.15.0), nucleus (v1.30.0 → v1.30.1) y orbit
  (v1.10.2 → v1.10.3). Módulos hermanos que cambian: quark cmd/quark (v1.0.1
  → v1.1.0) y sus cinco drivers (v0.2.1 → v0.2.2); los doce módulos de
  nucleus suben una patch (ldap v0.2.10 → v0.2.11, el resto v0.1.6 → v0.1.7);
  orbit agent (v0.7.1 → v0.7.2), server (v0.12.1 → v0.12.2), quarkbridge
  (v1.9.1 → v1.9.2) y quarkdatasource (v1.9.2 → v1.9.3); el resto sin
  cambio. Minor de suite porque lo es la de quark (QADR-0002). Corte en
  cadencia.

  Qué cambia para quien instala. Todo en quark, y todo por adición. LIKE
  escapado: WhereLike, WhereContains, WhereStartsWith, WhereEndsWith y los
  tipados escapan el texto del usuario y declaran el carácter de escape por
  motor; la forma plana Where(col, "LIKE", p) no cambia. El plan de
  migración lleva y emite índices, claves foráneas y CHECK, y el modelo los
  declara con quark:"index", check= y enum=; lo no declarado no se propone
  borrar. ALTER COLUMN de tipo, nulabilidad, default y clave primaria en los
  seis motores, con SQLite reconstruyendo la tabla. Tipos: uuid por forma,
  slices y maps almacenados (array nativo en PostgreSQL, JSON en el resto),
  Range[T], net.IP como INET, y los operadores de PostgreSQL rehusados fuera
  de él. El router RowLevelSecurityNative falla cerrado fuera de PostgreSQL y
  verifica al primer uso que el motor aplica las políticas
  (ErrRLSNotEnforced). PaginateAfter pagina por keyset con token opaco y una
  sentencia por página. El CLI planifica desde fuente —quark migrate
  diff|plan|verify --from-models— e instala y verifica políticas RLS; y
  PlanMigration sin modelos ahora rehúsa en vez de proponer borrar todas las
  tablas. Corrige que el confinamiento por tenant se perdiera dentro de una
  transacción (QK-26) y que precision/scale reescribiera columnas que no eran
  flotantes (QK-28, QK-30). El banco quark/internal/enterprisebench pasa de
  20 a 47 de 69 controles, cada ausente con su nota; los dos hallazgos
  rompientes del arco (QK-24, QK-32) esperan al major de A12. nucleus y
  orbit sólo alinean pines. El paraguas registra el guard 52º,
  umbrella-quark-posture: la cifra publicada es la que cuenta el banco y las
  seis pruebas del arco siguen corriendo en la lane de cada motor.

  Qué aprendió el tren. La prosa de quark escrita ANTES del commit de suelos
  se pierde cuando release-please regenera la rama; el rescate es reset al
  commit del bot, cherry-pick y push con lease. Una patch de nucleus también
  debe su sección de notas. Y el checkout hermano es del driver mientras el
  proceso vive: tocarlo a mano dejó la alineación de orbit en el main local.
  Todo en scripts/train/README.md, sección 1.35.0.
