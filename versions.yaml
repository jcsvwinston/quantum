# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.1.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-11
status: certified           # set de mantenimiento: GO-2026-5856 curada en orbit

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración y pata fleet (repo orbit), en tag y resolubles
# standalone — todos con toolchain go1.26.5: quarkbridge v0.2.1,
# quarkdatasource v0.2.1, proto v0.1.1, agent v0.2.1, server v0.3.1.
modules:
  quark:   "v1.1.5"
  nucleus: "v1.0.0"
  orbit:   "v1.1.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set.
workspace_pins:
  quark:   "v1.1.5"                                  # = tag
  nucleus: "a5fc3565"                                # = v1.0.0 + snapshot de docs 1.0.0 y housekeeping del CLI (código de la librería idéntico al tag; el sitio ensambla las docs versionadas desde este pin)
  orbit:   "v1.1.0"                                  # = tag

notes: >
  Quantum 1.1.0 — set de mantenimiento tras la convergencia. Orbit sube a
  v1.1.0: pin de toolchain go1.26.5 en los seis módulos (GO-2026-5856,
  crypto/tls, ALCANZADA en 4 de 5 módulos — mismo remedio que nucleus#185)
  más el listener Prometheus /metrics opt-in del admin-server y su
  --version desde build info. Nucleus (v1.0.0) ya llevaba el toolchain
  corregido desde su tren. ADVERTENCIA CONOCIDA, pendiente de decisión del
  responsable: quark v1.1.5 (go 1.25.7) alcanza 11 vulnerabilidades (10 de
  stdlib curadas en la línea go1.26.x + pgx v5.5.5, GO-2026-5004, fix
  v5.9.2 — la misma que nucleus#169); el remedio propuesto es un v1.1.6 de
  mantenimiento en el repo quark. El go.work de la suite también fija
  toolchain go1.26.5 (el plano de integración compila con la stdlib
  corregida).
