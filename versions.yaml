# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.2.0"            # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-07-11
status: certified           # los tres pilares curados + los waivers del gate de orbit pagados

# Versiones REALES publicadas de cada módulo (lo que la gente instala con `go get`).
# Módulos opt-in de integración y pata fleet (repo orbit), en tag y resolubles
# standalone: quarkbridge v0.3.0, quarkdatasource v0.2.1, proto v0.3.0,
# agent v0.4.0, server v0.5.0 (binario admin-server instalable con go install).
modules:
  quark:   "v1.2.0"
  nucleus: "v1.1.0"
  orbit:   "v1.2.0"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG. El RC de nucleus v1.1.0 pasó la
# validación de lockstep A-7 (quantum#48) antes del tag.
workspace_pins:
  quark:   "v1.2.0"                                  # = tag
  nucleus: "v1.1.0"                                  # = tag
  orbit:   "v1.2.0"                                  # = tag

notes: >
  Quantum 1.2.0 — el set que deja la suite SIN deuda conocida. Quark v1.2.0:
  release de mantenimiento+features acumuladas (las 11 advisories curadas —
  toolchain go1.26.5 + pgx v5.9.2, matriz de 6 motores verde — más
  scatter-gather de sharding y el resto del drift post-v1.1.5). Nucleus
  v1.1.0: SQLEvent.RowsAffected aditivo en la superficie Tier-1 (rebaseline
  deliberado +2). Orbit v1.2.0: LOS DOS WAIVERS DEL GATE v1.0 PAGADOS — W1:
  pantallas Access control (snapshot RBAC read-only ruteado al agente, que
  toma app.Authorizer automáticamente) y Audit log (ring del plano fleet en
  el server, atribuido al operador del UI auth chain) cableadas de punta a
  punta; W2: rows_affected en SqlStatementEvent, nacido en los exec del CRUD
  de nucleus y visible en la columna Rows del stream SQL. Pata fleet:
  proto v0.3.0, agent v0.4.0, server v0.5.0, todo resoluble por tag.
