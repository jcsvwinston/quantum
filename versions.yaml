# Manifiesto de la suite Quantum. Cada release Quantum es un cambio sobre este
# fichero que fija un trío de versiones compatibles. Entre releases, cada módulo
# saca subversiones por su cuenta; aquí solo se certifican conjuntos.
# Los sets 0.1.0–0.5.0 se certificaron solo como commits de este manifiesto
# (sin tag git); hay tag de suite en quantum desde v1.0.0.
# Ver docs/adr/QADR-0004-versions-yaml-manifiesto.md.
quantum: "1.26.0"           # versión de la SUITE (semver propio, != versiones de módulos)
released: 2026-09-03
status: certified           # Arco D3 publicado: drivers, exportadores y backends de nube salen a módulos opcionales. El hola-mundo de nucleus pasa de 75,6 MB a 19 y de 346 módulos a 87; la biblioteca de quark, de 24 MB a 6

# Versiones REALES publicadas de cada módulo (lo que la gente instala con
# `go get`). Los tres pilares en el bloque «modules», los seis módulos del
# repo orbit en «orbit_modules» — ambos machine-readable (DX-25): manifest-guard verifica
# las 9 contra los tags del pin, y scripts/print-requires.sh emite el bloque
# require pegable. El pin del root de quarkdatasource lag ≤1 minor
# topológicamente forzado, tolerado por el guard extendido, ceñido al único
# borde root↔quarkdatasource por MAQ-3.
modules:
  quark:   "v1.10.0"
  nucleus: "v1.23.0"
  orbit:   "v1.8.17"

# Módulos del repo nucleus que se publican aparte. Nucleus pasa a multi-módulo
# en v1.15.0: el backend LDAP vive en su propio módulo para que el framework
# no cargue un cliente LDAP. manifest-guard §3b verifica su tag igual que los
# cinco de orbit — y con una restricción que conviene tener presente: el tag
# del módulo debe ser ANCESTRO del pin raíz, y el pin raíz debe ser
# exactamente el commit del tag raíz, así que un tag de módulo cortado
# DESPUÉS del de la raíz no es certificable. Los bumps de módulo van dentro
# de la release de la raíz, no detrás.
nucleus_modules:
  mssql:         "v0.1.0"
  mysql:         "v0.1.0"
  oracle:        "v0.1.0"
  postgres:      "v0.1.0"
  sqlite:        "v0.1.0"
  otlp:          "v0.1.0"
  prometheus:    "v0.1.0"
  ldap:          "v0.2.4"
  secrets-aws:   "v0.1.0"
  storage-azure: "v0.1.0"
  storage-gcs:   "v0.1.0"
  storage-s3:    "v0.1.0"

# Módulos del repo quark que se publican aparte. Quark pasa a multi-módulo en
# v1.9.0: cada driver de base de datos vive en su propio módulo para que la
# biblioteca no cargue los tipos de error de cinco motores. Verificados por
# manifest-guard §3b igual que los de nucleus y orbit.
quark_modules:
  mssql:    "v0.1.0"
  mysql:    "v0.1.0"
  oracle:   "v0.1.0"
  postgres: "v0.1.0"
  sqlite:   "v0.1.0"

# Submódulos del repo orbit en el set certificado (una clave por módulo;
# antes vivían en un comentario en prosa que nada obligaba a mantener).
orbit_modules:
  proto:           "v0.4.2"
  agent:           "v0.6.10"
  server:          "v0.10.11"
  quarkbridge:     "v1.8.17"
  quarkdatasource: "v1.8.17"

# Commits exactos a los que se fijan los submódulos para que el `go.work`
# compile el set. Los tres pines EN TAG exacto.
workspace_pins:
  quark:   "7bb5a6e3"                                # = v1.10.0 exacto
  nucleus: "253ec05c"                                # = v1.23.0 exacto (y = providers/ldap/v0.2.4: los dos tags se cortaron en el MISMO commit, que es lo que permite certificar el módulo — ver manifest-guard §3b)
  orbit:   "a192117c"                                # = v1.8.17 exacto (contiene server/v0.10.11, agent/v0.6.10, proto/v0.4.2, quarkbridge/v1.8.17, quarkdatasource/v1.8.17 como ancestros — verificado por el manifest-guard §3/§3b en cada corrida de CI)

# Lags cross-repo DECLARADOS (QM6-1): requires de quark/nucleus en los módulos
# de orbit que van por detrás de la versión certificada de arriba. La regla del
# manifest-guard §5 es de DISCLOSURE: un require rancio NO declarado aquí rompe
# el CI; uno declarado pasa (MVS eleva la versión en cualquier app que también
# requiera la certificada). Mantener al día en cada re-pin; un lag de más de un
# minor debería alinearse, no declararse indefinidamente.
# VACÍO desde Quantum 1.8.0 (7ª ronda): todos los requires cross-repo de los
# módulos de orbit están alineados con el set certificado — el estado que la
# lane suite-integral exige para certificar (sin QUANTUM_ALLOW_DECLARED_LAGS).
declared_lags: {}

notes: >
  Quantum 1.26.0 — el set que publica el arco de adelgazado del grafo (quark
  v1.10.0 con sus cinco drivers en v0.1.0; nucleus v1.23.0 con once módulos
  hermanos en v0.1.0; orbit v1.8.17 con agent v0.6.10, server v0.10.11,
  quarkbridge v1.8.17, quarkdatasource v1.8.17 y proto v0.4.2 sin cambios).

  Los dos puentes saltan de la línea 0.x a 1.8.17. Un Release-As del tren se
  aplicó a todos los paquetes del repo de orbit y, cuando se detectó, el proxy
  de Go ya los servía —y es inmutable—, así que volver a 0.x habría dejado un
  `go get` público devolviendo una versión que este set no certifica. Se adopta
  el número; ni el código ni la API de los dos módulos cambian.

  Lo que cambia para quien instala: los drivers de base de datos, los
  backends de nube y los exportadores de telemetría dejan de venir dentro
  del framework y viajan en módulos propios, así que una aplicación enlaza
  sólo lo que usa. Medido sobre un programa que enlaza pkg/app y nada más,
  el hola-mundo de nucleus baja de 75,6 MB a 19 y de 346 módulos a 87; la
  biblioteca de quark, de 24 MB a 6 y de 171 módulos a 129. Los dos
  objetivos del arco —menos de 30 MB y menos de 150 módulos— quedan
  cumplidos con margen.

  La configuración no cambia ni una línea. database_url, otlp_endpoint,
  metrics_path y storage.provider significan lo mismo; lo único nuevo es un
  import en blanco, y `nucleus add <nombre>` hace el go get y lo escribe. Si
  falta, el arranque para y el error trae las dos líneas exactas —también en
  quark desde v1.10.0—. Desaparecen además los build tags mssql y oracle,
  que nada en el código mencionaba y por eso fallaban en ejecución en vez de
  al compilar.

  Un módulo de driver registra DOS cosas —el driver y cómo ese driver
  reporta una violación de unicidad—, y esa es la parte que no se puede
  omitir: sin el clasificador la comprobación no falla, contesta que no. El
  gate de seis motores de quark lo reprodujo en vivo antes de publicarlo, y
  un test de orbit contra motor real lo volvió a cazar en un consumidor.

  El único cambio de comportamiento del set es Prometheus: lo activaba
  metrics_path, que tiene valor por defecto, así que quien scrapea el
  /metrics por defecto lo pierde hasta añadir exporters/prometheus. La
  aplicación avisa al arrancar y sigue; si la clave estaba escrita a mano,
  para. Está en las notas de nucleus y en la doc pública.

  El manifiesto estrena quark_modules y declara los diecisiete módulos
  hermanos de los tres repos, que manifest-guard DESCUBRE del árbol en vez
  de leerlos de una lista escrita a mano — la lista fija era el mismo fallo
  que dejó once módulos publicables sin entrada en release-please. Y el
  desfase del `require` de un módulo hacia su propia raíz pasa a AVISO: es
  un suelo, no un pin, y Go resuelve al máximo, así que un consumidor
  compila contra la raíz certificada de todos modos; el aviso dice los días
  que lleva sin revisarse y la versión que lo deja al día.
